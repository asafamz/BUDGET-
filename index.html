/* ================= Budge CSV import ================= */
function parseCSVText(text){
  const rows = []; let row = [], field = '', inQ = false;
  const s = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  for (let i = 0; i < s.length; i++){
    const c = s[i];
    if (inQ){
      if (c === '"'){ if (s[i+1] === '"'){ field += '"'; i++; } else inQ = false; }
      else field += c;
    } else if (c === '"'){ inQ = true; }
    else if (c === ','){ row.push(field); field = ''; }
    else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
    else field += c;
  }
  row.push(field); rows.push(row);
  return rows.filter(r => !(r.length === 1 && r[0] === ''));
}
function budgeDate(s){
  const m = /^(\d{2})-(\d{2})-(\d{4})$/.exec(String(s || '').trim());
  if (!m) return null;
  const iso2 = m[3] + '-' + m[1] + '-' + m[2];
  return isISO(iso2) ? iso2 : null;
}
function fnv1a(str){
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(16);
}
const BUDGE_EXPENSE_MAP = {food:'food', supermarket:'food', transport:'transport', house:'housing', health:'health',
  education:'education', communications:'phone', electronics:'shopping', business:'business', work:'business',
  other:'other', allowance:'family', 'transaction charges':'fees'};
const BUDGE_INCOME_MAP = {business:'business', other:'other', transport:'other', work:'salary'};
const BUDGE_CUSTOM = {
  gifts: {name:'Gifts', e:'🎁', c:'#EC4899'},
  travel: {name:'Travel', e:'✈️', c:'#0EA5E9'},
  land: {name:'Land', e:'🏞️', c:'#84CC16'},
  'inv. portfolio': {name:'Investments', e:'📈', c:'#A855F7'}
};
const BUDGE_WALLET_DISPLAY = {'m-pesa':'M-Pesa', 'hard cash':'Cash'};
const BUDGE_GOAL_EMOJI = {'financial freedom':'📈', 'buy a car':'🚗', 'truck purchase':'🚚', 'land purchase':'🏞️'};

function parseBudgeCSV(text){
  const all = parseCSVText(text).filter(r => !(r.length === 1 && r[0].trim() === '###'));
  const norm = r => (r[0] || '').trim();
  const txHdr = all.findIndex(r => norm(r) === 'Date' && r.some(c => c.trim() === 'Amount') && r.some(c => c.trim() === 'Account'));
  if (txHdr < 0) return {ok:false, error:'format'};
  const acctHdr = all.findIndex((r,i) => i > txHdr && norm(r) === 'Account' && r.some(c => c.trim() === 'Account Balance'));
  const goalHdr = all.findIndex((r,i) => i > txHdr && norm(r) === 'Goal' && r.some(c => c.trim() === 'Required sum'));
  const txEnd = acctHdr > txHdr ? acctHdr : (goalHdr > txHdr ? goalHdr : all.length);
  const txRows = all.slice(txHdr + 1, txEnd).filter(r => r.join('').trim() !== '' && r.length >= 6);
  const acctRows = acctHdr >= 0 ? all.slice(acctHdr + 1, goalHdr > acctHdr ? goalHdr : all.length).filter(r => r.join('').trim() !== '' && r.length >= 2) : [];
  const goalRows = goalHdr >= 0 ? all.slice(goalHdr + 1).filter(r => r.join('').trim() !== '' && r.length >= 2) : [];
  if (!txRows.length) return {ok:false, error:'empty'};

  const accounts = {};
  acctRows.forEach(a => {
    const name = (a[0] || '').trim(); if (!name) return;
    accounts[name] = {name, balance: Number(a[1]), currentBalance: Number(a[1])};
  });
  txRows.forEach(r => { const acct = (r[5] || '').trim(); if (acct && !accounts[acct]) accounts[acct] = {name:acct, balance:null, currentBalance:null}; });

  const parsed = [], skipped = {unpaid:0, zero:0};
  txRows.forEach(r => {
    const [dateS, payment, isPaid, amountS, cur, acct, cat, sub, goal, desc] = [r[0],r[1],r[2],r[3],r[4],r[5],r[6],r[7],r[8],r[9]].map(x => x || '');
    const date = budgeDate(dateS);
    const amt = Number(amountS);
    if (!date || !isFinite(amt)) return;
    if ((isPaid || '').trim().toLowerCase() !== 'true'){ skipped.unpaid++; return; }
    if (amt === 0){ skipped.zero++; return; }
    parsed.push({date, payment:payment.trim(), amount:amt, currency:(cur||'').trim(), account:(acct||'').trim(),
      category:(cat||'').trim(), subcategory:(sub||'').trim(), goal:(goal||'').trim(), desc:(desc||'').trim()});
  });

  const goals = goalRows.map(g => {
    const name = (g[0] || '').trim(); if (!name) return null;
    const target = Number(g[1]); if (!(target > 0)) return null;
    const acc = Number(g[3]) || 0;
    const deadline = budgeDate(g[5] || '');
    return {name, target: round2(target), accumulated: round2(acc), deadline};
  }).filter(Boolean);

  return {ok:true, accounts, tx:parsed, goals, skipped, currency: (txRows[0] && txRows[0][4]) ? txRows[0][4].trim() : 'USD'};
}

function planBudgeImport(parsed){
  if (!parsed.ok) return parsed;
  const plan = {newWallets:[], matchedWallets:[], newTx:[], dupCount:0, unmatchedTransferCount:0,
    newGoals:[], updatedGoals:[], newCats:[], currency: parsed.currency, error:null};

  // wallets: match existing by name, else stage a new one
  const walletFor = {};
  const catCache = {};
  const stagedCats = {};
  plan.reconcileExisting = [];
  Object.keys(parsed.accounts).forEach(name => {
    const display = BUDGE_WALLET_DISPLAY[name.trim().toLowerCase()] || name.trim();
    const existing = db.wallets.find(w => w.name.trim().toLowerCase() === display.toLowerCase());
    if (existing){
      walletFor[name] = existing.id;
      const isEmpty = !existing.opening && !db.tx.some(x => x.wallet === existing.id || x.toWallet === existing.id);
      plan.matchedWallets.push({name:display, id:existing.id, isNew:false, reconciled:isEmpty});
      if (isEmpty) plan.reconcileExisting.push({id:existing.id, currentBalance: parsed.accounts[name].currentBalance});
    } else {
      const id = 'w_' + uid();
      walletFor[name] = id;
      plan.newWallets.push({id, name:display, type:guessWalletType(display), opening:0, archived:false, currentBalance: parsed.accounts[name].currentBalance});
    }
  });
  const existingHashes = new Set(db.tx.map(x => x.src).filter(Boolean));

  // transfers: pair by date+abs(amount) among category 'Transfer'
  const isTransfer = x => x.category.toLowerCase() === 'transfer';
  const transferRows = parsed.tx.filter(isTransfer);
  const other = parsed.tx.filter(x => !isTransfer(x));
  const groups = {};
  transferRows.forEach(x => { const k = x.date + '|' + Math.abs(round2(x.amount)); (groups[k] = groups[k] || []).push(x); });
  const netByWallet = {};
  const addNet = (wid, d) => { netByWallet[wid] = (netByWallet[wid] || 0) + d; };

  function resolveCat(name, type){
    const key = name.trim().toLowerCase();
    if (type === 'expense' && BUDGE_EXPENSE_MAP[key]) return BUDGE_EXPENSE_MAP[key];
    if (type === 'income' && BUDGE_INCOME_MAP[key]) return BUDGE_INCOME_MAP[key];
    if (BUDGE_CUSTOM[key]){
      if (catCache[key]) return catCache[key];
      const existingCat = db.cats.find(c => c.name.trim().toLowerCase() === BUDGE_CUSTOM[key].name.toLowerCase() && c.type === 'expense');
      if (existingCat){ catCache[key] = existingCat.id; return existingCat.id; }
      if (stagedCats[key]) return stagedCats[key].id;
      const id = 'c_' + uid();
      stagedCats[key] = Object.assign({id, type:'expense'}, BUDGE_CUSTOM[key]);
      plan.newCats.push(stagedCats[key]);
      catCache[key] = id;
      return id;
    }
    return 'other';
  }

  Object.keys(groups).forEach(k => {
    const grp = groups[k];
    if (grp.length === 2 && grp.some(x => x.amount < 0) && grp.some(x => x.amount > 0)){
      const outLeg = grp.find(x => x.amount < 0), inLeg = grp.find(x => x.amount > 0);
      const fromW = walletFor[outLeg.account], toW = walletFor[inLeg.account];
      const amount = round2(Math.abs(outLeg.amount));
      const src = 'budge:' + fnv1a(['tr', outLeg.date, amount, outLeg.account, inLeg.account].join('|'));
      addNet(fromW, -amount); addNet(toW, amount);
      if (existingHashes.has(src)){ plan.dupCount++; return; }
      plan.newTx.push({type:'transfer', amount, cat:'transfer', desc:'', date:outLeg.date, wallet:fromW, toWallet:toW, src});
    } else {
      grp.forEach(x => { other.push(x); plan.unmatchedTransferCount++; });
    }
  });

  other.forEach(x => {
    const wid = walletFor[x.account];
    const type = x.amount < 0 ? 'expense' : 'income';
    const amount = round2(Math.abs(x.amount));
    const cat = resolveCat(x.category || 'Other', type);
    const label = (x.payment || x.desc || x.category || '').slice(0,60);
    const src = 'budge:' + fnv1a([x.date, x.amount, x.account, x.payment, x.category].join('|'));
    addNet(wid, type === 'income' ? amount : -amount);
    if (existingHashes.has(src)){ plan.dupCount++; return; }
    plan.newTx.push({type, amount, cat, desc:label, date:x.date, wallet:wid, src});
  });

  plan.newWallets.forEach(w => { w.opening = round2((w.currentBalance || 0) - (netByWallet[w.id] || 0)); delete w.currentBalance; });
  plan.reconcileExisting.forEach(r => { r.opening = round2((r.currentBalance || 0) - (netByWallet[r.id] || 0)); delete r.currentBalance; });

  // goals: merge by name
  const goalTxDates = {};
  parsed.tx.forEach(x => { if (x.goal){ const k = x.goal.trim().toLowerCase(); (goalTxDates[k] = goalTxDates[k] || []).push(x.date); } });
  parsed.goals.forEach(g => {
    const key = g.name.trim().toLowerCase();
    const existing = db.goals.find(gg => gg.name.trim().toLowerCase() === key && Math.abs(gg.target - g.target) < 0.01);
    if (existing){
      const saved = goalSaved(existing);
      const delta = round2(g.accumulated - saved);
      if (Math.abs(delta) >= 0.01) plan.updatedGoals.push({id:existing.id, name:existing.name, delta, newTarget: g.target !== existing.target ? g.target : null});
    } else {
      const dates = (goalTxDates[key] || []).sort();
      plan.newGoals.push({id:'g_' + uid(), name:g.name.slice(0,40), e:BUDGE_GOAL_EMOJI[key] || '🎯', target:g.target,
        deadline:g.deadline, hist: g.accumulated > 0 ? [{d: dates[0] || parsed.tx[0].date, a:g.accumulated}] : [], created:Date.now()});
    }
  });

  plan.skipped = parsed.skipped;
  plan.walletCount = plan.newWallets.length + plan.matchedWallets.length;
  return plan;
}

function commitImport(){

  if (db.settings.currency === 'USD' && !db.tx.length && !db.wallets.some(w => w.opening) && plan.currency && validCurrency(plan.currency) && plan.currency !== db.settings.currency){
    db.settings.currency = plan.currency; fmtCache = null;
  }
  plan.newCats.forEach(c => db.cats.push(c));
  plan.newWallets.forEach(w => db.wallets.push(w));
  (plan.reconcileExisting || []).forEach(r => { const w = db.wallets.find(x => x.id === r.id); if (w) w.opening = r.opening; });
  plan.newTx.forEach(x => db.tx.push(Object.assign({id:uid(), created:Date.now()}, x)));
  plan.newGoals.forEach(g => db.goals.push(g));
  plan.updatedGoals.forEach(u => {
    const g = db.goals.find(gg => gg.id === u.id); if (!g) return;
    if (u.newTarget) g.target = u.newTarget;

const CLOUD_FILE = 'asafamz-budget.json';
const DRIVE = 'https://www.googleapis.com/drive/v3/files';
const DRIVE_UP = 'https://www.googleapis.com/upload/drive/v3/files';
let gToken = null, gTokenExp = 0, cloudTimer = null, cloudBusy = false;
function cloudAvailable(){ return !!GOOGLE_CLIENT_ID && /^https?:$/.test(location.protocol); }
function gisReady(){ return !!(window.google && google.accounts && google.accounts.oauth2); }
function loadGis(){
  return new Promise((res, rej) => {
    if (gisReady()) return res();
    const sc = document.createElement('script');
    sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true;
    sc.onload = () => gisReady() ? res() : rej(new Error('gis'));
    sc.onerror = () => rej(new Error('gis'));
    document.head.appendChild(sc);
  });
}
function preloadGis(){ if (cloudAvailable()) loadGis().catch(() => {}); }
function tokenValid(){ return gToken && Date.now() < gTokenExp - 60000; }
async function getToken(interactive){
  if (tokenValid()) return gToken;
  if (!interactive) return null;
  if (!gisReady()) await loadGis();
  return new Promise((res, rej) => {
    const cfg = {
      client_id: GOOGLE_CLIENT_ID,
      scope: 'https://www.googleapis.com/auth/drive.appdata email',
      callback: r => {
        if (!r || r.error){ rej(new Error((r && r.error) || 'auth')); return; }
        gToken = r.access_token; gTokenExp = Date.now() + (Number(r.expires_in) || 3600) * 1000; res(gToken);
      },
      error_callback: e => rej(new Error((e && e.type) || 'popup'))
    };
    if (db.settings.cloud && db.settings.cloud.email) cfg.login_hint = db.settings.cloud.email;
    google.accounts.oauth2.initTokenClient(cfg).requestAccessToken({prompt: db.settings.cloud ? '' : 'consent'});
  });
}
async function gfetch(url, init, interactive){
  const tok = await getToken(interactive);
  if (!tok) throw new Error('auth');
  init = init || {};
  const r = await fetch(url, Object.assign({}, init, {headers: Object.assign({}, init.headers || {}, {Authorization:'Bearer ' + tok})}));
  if (r.status === 401){ gToken = null; throw new Error('auth'); }
  if (!r.ok) throw new Error('http ' + r.status);
  return r;
}
async function cloudFind(interactive){
  const q = encodeURIComponent("name='" + CLOUD_FILE + "' and trashed=false");
  const r = await gfetch(DRIVE + '?spaces=appDataFolder&fields=' + encodeURIComponent('files(id,modifiedTime)') + '&orderBy=modifiedTime%20desc&q=' + q, null, interactive);
  const j = await r.json();
  return (j.files || [])[0] || null;
}
async function cloudUpload(interactive){
  const body = buildBackup();
  const f = await cloudFind(interactive);
  if (f){
    await gfetch(DRIVE_UP + '/' + f.id + '?uploadType=media', {method:'PATCH', headers:{'Content-Type':'application/json'}, body});
  } else {
    const b = 'asafamz' + uid();
    const meta = {name:CLOUD_FILE, parents:['appDataFolder'], mimeType:'application/json'};
    const multi = '--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(meta) +
      '\r\n--' + b + '\r\nContent-Type: application/json\r\n\r\n' + body + '\r\n--' + b + '--';
    await gfetch(DRIVE_UP + '?uploadType=multipart', {method:'POST', headers:{'Content-Type':'multipart/related; boundary=' + b}, body:multi});
  }
  if (db.settings.cloud){ db.settings.cloud.last = Date.now(); db.settings.cloud.dirty = false; }
  save(true);
}
async function cloudDownload(interactive){
  const f = await cloudFind(interactive);
  if (!f) return null;
  const r = await gfetch(DRIVE + '/' + f.id + '?alt=media');
  return {text: await r.text(), modified: f.modifiedTime};
}
async function cloudEmail(){
  try { const r = await gfetch('https://www.googleapis.com/oauth2/v3/userinfo'); const j = await r.json(); return j.email || null; }
  catch(e){ return null; }
}

/* ================= PIN lock ================= */
let lockMode = null, pinBuf = '', pinFirst = '', lockDone = null, hiddenAt = 0;
async function hashPin(pin, salt, algo){
  if (algo === 'sha256'){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pin));
    return 'sha256:' + Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }
  let h1 = 5381, h2 = 52711; const s = salt + ':' + pin;
  for (let r = 0; r < 2000; r++) for (let i = 0; i < s.length; i++){ const c = s.charCodeAt(i); h1 = (h1 * 33) ^ c; h2 = (h2 * 33) ^ c ^ r; }
  return 'djb:' + (h1 >>> 0).toString(16) + (h2 >>> 0).toString(16);
}
function hasSubtle(){ try { return !!(window.crypto && crypto.subtle && crypto.subtle.digest); } catch(e){ return false; } }
async function checkPin(pin){
  const stored = db.settings.pinHash || '';
  const algo = stored.startsWith('sha256:') ? 'sha256' : 'djb';
  if (algo === 'sha256' && !hasSubtle()) return false;
  return (await hashPin(pin, db.settings.pinSalt, algo)) === stored;
}
function showLock(mode, done){
  lockMode = mode; lockDone = done || null; pinBuf = ''; pinFirst = '';
  $('#lock').hidden = false;
  $('#lockMain').hidden = false; $('#lockForgotBox').hidden = true;
  document.body.classList.add('locked');
  updateLock();
}
function hideLock(){
  $('#lock').hidden = true; lockMode = null; pinBuf = '';
  if (!openSheets.length) document.body.classList.remove('locked');
}
function updateLock(msg){
  const titles = {unlock:'enter_pin', verify:'current_pin', set1:'create_pin', set2:'confirm_pin'};
  $('#lockTitle').textContent = t(titles[lockMode] || 'enter_pin');
  $$('#pinDots i').forEach((d, i) => d.classList.toggle('on', i < pinBuf.length));
  $('#lockErr').textContent = msg || '';
  $('#lockForgot').hidden = lockMode !== 'unlock';
  $('#lockCancel').hidden = lockMode === 'unlock';
}
function lockShake(msg){
  const dots = $('#pinDots');
  dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake');
  pinBuf = '';
  updateLock(msg);
}
async function pinKey(k){
  if (!lockMode) return;
  if (k === 'del'){ pinBuf = pinBuf.slice(0, -1); updateLock(); return; }
  if (pinBuf.length >= 4) return;
  pinBuf += k; updateLock();
  if (pinBuf.length < 4) return;
  const entered = pinBuf;
  if (lockMode === 'unlock' || lockMode === 'verify'){
    const ok = await checkPin(entered);
    if (ok){ const fn = lockDone; hideLock(); if (fn) fn(); }
    else lockShake(hasSubtle() || !(db.settings.pinHash || '').startsWith('sha256:') ? t('wrong_pin') : t('pin_unavailable'));
  } else if (lockMode === 'set1'){
    pinFirst = entered; lockMode = 'set2'; pinBuf = ''; updateLock();
  } else if (lockMode === 'set2'){
    if (entered === pinFirst){
      const salt = uid();
      const algo = hasSubtle() ? 'sha256' : 'djb';
      const wasOn = !!db.settings.pinHash;
      db.settings.pinHash = await hashPin(entered, salt, algo);
      db.settings.pinSalt = salt;
      save(); hideLock(); renderSettings();
      toast(t(wasOn ? 'pin_changed' : 'pin_on'));
    } else {
      lockMode = 'set1'; pinFirst = '';
      lockShake(t('pin_mismatch'));
    }
  }
}

/* ================= Events ================= */
function bind(){
  $$('.tab[data-view]').forEach(b => b.addEventListener('click', () => showView(b.dataset.view)));
  $('#settingsBtn').addEventListener('click', () => { preloadGis(); showView('settings'); });
  $('#addBtn').addEventListener('click', () => openTx({}));
  $('#prevMonth').addEventListener('click', () => { viewMonth = shiftMonth(viewMonth, -1); selDay = null; render(); });
  $('#nextMonth').addEventListener('click', () => { if (viewMonth < maxMonth()){ viewMonth = shiftMonth(viewMonth, 1); selDay = null; render(); } });
  $('#gaugeBtn').addEventListener('click', () => openNum('budget'));
  $('#manageWallets').addEventListener('click', () => showView('wallets'));
  $('#wdMatch').addEventListener('click', () => { const id = wdId; openReconcile(id); });
  $('#wdActivity').addEventListener('click', () => { walletFilter = wdId; histFilter = 'all'; closeSheet('wdSheet'); showView('activity'); });
  $('#wdTransfer').addEventListener('click', () => { const id = wdId; closeSheet('wdSheet'); openTx({type:'transfer', from:id}); });
  $('#wdEdit').addEventListener('click', () => { const id = wdId; closeSheet('wdSheet'); openWallet(id); });
  $('#recInput').addEventListener('input', () => { $('#recErr').textContent = ''; updateReconcile(); });
  $('#recPrimary').addEventListener('click', () => applyReconcile('record'));
  $('#recJust').addEventListener('click', () => applyReconcile('just'));
  $('#balWallet').addEventListener('change', e => { balWallet = e.target.value; renderBalanceChart(); });
  $$('#rangeChips .chip').forEach(c => c.addEventListener('click', () => { balRange = c.dataset.range; renderBalanceChart(); }));
  $('#balChart').addEventListener('pointerdown', e => { if (e.target.closest('#chartWrap')) chartPoint(e.clientX); });
  $('#balChart').addEventListener('pointermove', e => { if (e.target.closest('#chartWrap')) chartPoint(e.clientX); });
  $('#secondSel').addEventListener('change', e => {
    const cur = e.target.value;
    const prev = db.settings.second;
    const keep = prev && prev.cur === cur && prev.base === db.settings.currency;
    db.settings.second = cur ? {cur, rate: keep ? prev.rate : null, base: db.settings.currency, auto: keep ? prev.auto : true, updated: keep ? prev.updated : null} : null;
    save(); render();
    if (cur && db.settings.second.auto && !keep){
      refreshRate(true).then(ok => {
        if (ok) toast(t('rate_updated_toast'));
        else if (db.settings.second && db.settings.second.cur === cur && !db.settings.second.rate){ toast(t('rate_offline_set')); openNum('rate'); }
      });
    } else if (cur && !db.settings.second.rate) openNum('rate');
  });
  $('#rateAutoSwitch').addEventListener('change', e => {
    const s2 = db.settings.second; if (!s2) return;
    s2.auto = e.target.checked; save(); render();
    if (s2.auto) refreshRate(true).then(ok => toast(t(ok ? 'rate_updated_toast' : 'rate_offline_kept')));
  });
  $('#rowRate').addEventListener('click', () => openNum('rate'));

  document.addEventListener('click', e => {
    if (e.target.closest && e.target.closest('button,.tab,.chip,.fab,label.set-row')) haptic();
    const el = e.target.closest('[data-go],[data-id],[data-action],[data-wallet],[data-month],[data-day],[data-pay],[data-skip],[data-edit-budget],[data-cat-budget],[data-goal],[data-recur],[data-wallet-edit],[data-wallet-open],[data-del-cat],[data-close]');
    if (!el) return;
    const d = el.dataset;
    if (d.close !== undefined){ const s = el.closest('.scrim'); if (s) closeSheet(s.id); return; }
    if (d.go){ if (d.planTab) planTab = d.planTab; showView(d.go); return; }
    if (d.id && el.classList.contains('tx')){ openTx({id:d.id}); return; }
    if (d.action === 'add'){ openTx({}); return; }
    if (d.action === 'add-wallet'){ openWallet(); return; }
    if (d.action === 'new-goal'){ openGoal(); return; }
    if (d.action === 'new-repeat'){ openTx({mode:'recur'}); return; }
    if (d.wallet){ openWalletDetail(d.wallet); return; }
    if (d.walletOpen){ openWalletDetail(d.walletOpen); return; }
    if (d.action === 'transfer'){ openTx({type:'transfer'}); return; }
    if (d.month){ viewMonth = d.month; selDay = null; render(); return; }
    if (d.day){ selDay = d.day; renderActivity(); return; }
    if (d.pay){ payRecurring(d.pay, false); return; }
    if (d.skip){ payRecurring(d.skip, true); return; }
    if (d.editBudget){ openNum('budget'); return; }
    if (d.catBudget){ openNum('cat', d.catBudget); return; }
    if (d.goal){ openGoalMoney(d.goal); return; }
    if (d.recur){ openTx({mode:'recur', recurId:d.recur}); return; }
    if (d.walletEdit){ openWallet(d.walletEdit); return; }
    if (d.delCat){ deleteCat(d.delCat); return; }
  });

  $$('.scrim').forEach(s => s.addEventListener('click', e => {
    if (e.target === s && !s.dataset.locked) closeSheet(s.id);
  }));
  document.addEventListener('keydown', e => {
    if (!$('#lock').hidden && lockMode){
      if (/^[0-9]$/.test(e.key)){ pinKey(e.key); e.preventDefault(); }
      else if (e.key === 'Backspace'){ pinKey('del'); e.preventDefault(); }
      return;
    }
    if (e.key === 'Escape' && openSheets.length){
      const id = openSheets[openSheets.length-1];
      if (!document.getElementById(id).dataset.locked) closeSheet(id);
    }
  });

  // Activity
  $('#search').addEventListener('input', e => { histQuery = e.target.value; renderActivity(); });
  $$('#typeChips .chip').forEach(c => c.addEventListener('click', () => { histFilter = c.dataset.filter; renderActivity(); }));
  $('#walletFilter').addEventListener('change', e => { walletFilter = e.target.value; renderActivity(); });
  $$('#modeSeg button').forEach(b => b.addEventListener('click', () => { actMode = b.dataset.mode; renderActivity(); }));

  // Plan
  $$('#planSeg button').forEach(b => b.addEventListener('click', () => { planTab = b.dataset.plan; render(); }));
  $('#planBody').addEventListener('change', e => {
    if (e.target.id === 'rolloverSwitch'){ db.settings.rollover = e.target.checked; save(); render(); }
  });

  // Transaction sheet
  $$('#txTypeSeg [data-type]').forEach(b => b.addEventListener('click', () => { txS.type = b.dataset.type; renderTxType(); }));
  $('#txCats').addEventListener('click', e => {
    const b = e.target.closest('.cat'); if (!b) return;
    txS.cat = b.dataset.cat;
    $$('#txCats .cat').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  });
  $('#txMakeRecur').addEventListener('change', renderTxType);
  $('#txSave').addEventListener('click', saveTx);
  $('#txDelete').addEventListener('click', deleteTx);
  ['#txAmount','#txDesc','#txFee'].forEach(s => $(s).addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); saveTx(); } }));
  $('#txAmount').addEventListener('input', () => { if ($('#txErr').textContent !== t('need_two_wallets')) $('#txErr').textContent = ''; });

  // Number sheet
  $('#numSave').addEventListener('click', saveNum);
  $('#numRemove').addEventListener('click', () => { $('#numInput').value = ''; saveNum(); });
  $('#numInput').addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); saveNum(); } });

  // Wallet sheets
  $('#walletTypes').addEventListener('click', e => {
    const b = e.target.closest('[data-wtype]'); if (!b) return;
    wS.type = b.dataset.wtype; wS.touched = true; renderWalletTypes();
  });
  $('#walletName').addEventListener('input', () => { if (!wS.touched){ wS.type = guessWalletType($('#walletName').value); renderWalletTypes(); } });
  $('#walletSave').addEventListener('click', saveWallet);
  $('#walletDel').addEventListener('click', walletDelete);

  // Categories
  $('#newCatType').addEventListener('click', e => { const b = e.target.closest('[data-ctype]'); if (!b) return; newCat.type = b.dataset.ctype; renderCatsSheet(); });
  $('#newCatEmoji').addEventListener('click', e => { const b = e.target.closest('[data-emo]'); if (!b) return; newCat.e = b.dataset.emo; $$('#newCatEmoji .emo').forEach(x => x.setAttribute('aria-pressed', String(x === b))); });
  $('#catAdd').addEventListener('click', addCat);

  // Goals
  $('#goalEmoji').addEventListener('click', e => { const b = e.target.closest('[data-gemo]'); if (!b) return; gS.e = b.dataset.gemo; $$('#goalEmoji .emo').forEach(x => x.setAttribute('aria-pressed', String(x === b))); });
  $('#goalSave').addEventListener('click', saveGoal);
  $('#goalDel').addEventListener('click', deleteGoal);
  $('#gmAdd').addEventListener('click', () => goalMoney(1));
  $('#gmTake').addEventListener('click', () => goalMoney(-1));
  $('#gmEdit').addEventListener('click', () => { const id = gmId; closeSheet('gmSheet'); openGoal(id); });

  // Settings
  $$('#langSeg button').forEach(b => b.addEventListener('click', () => { setLang(b.dataset.lang); fillCurrency($('#currencySel'), true); save(); render(); }));
  $('#currencySel').addEventListener('change', e => {
    db.settings.currency = e.target.value; fmtCache = null; save(); render();
    toast(t('currency_set', {c:db.settings.currency}));
    refreshRate(true);
  });
  $$('#themeSeg button').forEach(b => b.addEventListener('click', () => { db.settings.theme = b.dataset.themeOpt; save(); applyTheme(); renderSettings(); }));
  $$('#lookSeg button').forEach(b => b.addEventListener('click', () => { db.settings.look = b.dataset.lookOpt; save(); applyTheme(); render(); }));
  $('#rowWallets').addEventListener('click', () => showView('wallets'));
  $('#rowCats').addEventListener('click', openCats);
  $('#rowBudget').addEventListener('click', () => openNum('budget'));
  $('#pinSwitch').addEventListener('change', e => {
    const on = e.target.checked;
    e.target.checked = !!db.settings.pinHash;
    if (on && !db.settings.pinHash) showLock('set1');
    else if (!on && db.settings.pinHash) showLock('verify', () => { db.settings.pinHash = null; db.settings.pinSalt = null; save(); renderSettings(); toast(t('pin_off')); });
  });
  $('#rowChangePin').addEventListener('click', () => showLock('verify', () => showLock('set1')));
  $('#rowCsv').addEventListener('click', () => openExport('csv'));
  $('#rowBackup').addEventListener('click', () => openExport('backup'));
  $('#rowImportBudge').addEventListener('click', () => { resetImportSheet(); openSheet('importSheet'); });
  $('#importPreviewBtn').addEventListener('click', previewImport);
  $('#importFile').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0]; e.target.value = '';
    if (!f) return;
    if (f.size > 15 * 1024 * 1024){ $('#importErr').textContent = t('file_large'); return; }
    const reader = new FileReader();
    reader.onload = () => { $('#importText').value = String(reader.result || ''); $('#importErr').textContent = ''; };
    reader.onerror = () => { $('#importErr').textContent = t('file_unreadable'); };
    reader.readAsText(f);
  });
  $('#rowRestore').addEventListener('click', () => { $('#restoreErr').textContent = ''; openSheet('restoreSheet'); });
  $('#rowErase').addEventListener('click', () => openConfirm(t('erase_title'), t('erase_note'), t('erase_everything'), () => { closeSheet('confirmSheet'); eraseAll(); }));
  $('#cfOk').addEventListener('click', () => { if (confirmFn) confirmFn(); });

  // Export / restore
  $('#expDownload').addEventListener('click', downloadExport);
  $('#expCopy').addEventListener('click', copyExport);
  $('#restoreFile').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    if (f.size > 10 * 1024 * 1024){ $('#restoreErr').textContent = t('file_large'); return; }
    const reader = new FileReader();
    reader.onload = () => { $('#restoreText').value = String(reader.result || ''); $('#restoreErr').textContent = ''; };
    reader.onerror = () => { $('#restoreErr').textContent = t('file_unreadable'); };
    reader.readAsText(f);
  });
  $('#restoreBtn').addEventListener('click', restore);

  // Setup
  $$('#setupLang button').forEach(b => b.addEventListener('click', () => {
    const prevDefaults = defaultSetupRows().map(r => r.name);
    setLang(b.dataset.lang);
    fillCurrency($('#setupCur'), true);
    const nextDefaults = defaultSetupRows().map(r => r.name);
    setupRows.forEach(r => { const i = prevDefaults.indexOf(r.name); if (i >= 0) r.name = nextDefaults[i]; });
    renderSetup(); render();
  }));
  $('#setupCur').addEventListener('change', e => {
    const prev = defaultSetupRows();
    db.settings.currency = e.target.value; fmtCache = null;
    const next = defaultSetupRows();
    setupRows.forEach(r => { const i = prev.findIndex(p => p.name === r.name); if (i >= 0){ r.name = next[i].name; r.type = next[i].type; } });
    renderSetup();
  });
  $('#setupWallets').addEventListener('input', e => {
    const i = e.target.dataset.srow; if (i == null) return;
    const r = setupRows[+i]; if (!r) return;
    if (e.target.dataset.sf === 'name'){ r.name = e.target.value; r.type = guessWalletType(r.name); }
    else r.amt = e.target.value;
  });
  $('#setupWallets').addEventListener('click', e => {
    const b = e.target.closest('[data-srow-del]'); if (!b || setupRows.length < 2) return;
    setupRows.splice(+b.dataset.srowDel, 1); renderSetup();
  });
  $('#setupAddWallet').addEventListener('click', () => { setupRows.push({name:'', type:'other', amt:''}); renderSetup(); const ins = $$('#setupWallets input[data-sf="name"]'); if (ins.length) ins[ins.length-1].focus(); });
  $('#setupStart').addEventListener('click', startTracking);
  $('#setupSample').addEventListener('click', () => {
    if (!readSetupBasics()) return;
    loadSample();
    db.settings.setup = true;
    save(); closeSheet('setupSheet');
    viewMonth = currentMonth();
    render(); toast(t('sample_loaded'));
  });

  // Cloud
  $('#rowCloudConnect').addEventListener('click', () => { if (!db.settings.cloud) cloudConnect(false); });
  $('#rowCloudBackup').addEventListener('click', cloudBackupNow);
  $('#nudgeBackup').addEventListener('click', cloudBackupNow);
  $('#rowCloudRestore').addEventListener('click', cloudRestoreNow);
  $('#cloudAutoSwitch').addEventListener('change', e => { if (db.settings.cloud){ db.settings.cloud.auto = e.target.checked; save(true); if (e.target.checked){ db.settings.cloud.dirty = true; scheduleCloud(); } renderCloud(); } });
  $('#rowCloudDisconnect').addEventListener('click', () => { cloudForget(); db.settings.cloud = null; save(true); render(); toast(t('cloud_disconnected')); });
  $('#setupCloud').addEventListener('click', () => cloudConnect(true));

  // Lock
  $('#keypad').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) pinKey(b.dataset.k); });
  $('#lockCancel').addEventListener('click', () => { hideLock(); renderSettings(); });
  $('#lockForgot').addEventListener('click', () => { $('#lockMain').hidden = true; $('#lockForgotBox').hidden = false; });
  $('#lockBack').addEventListener('click', () => { $('#lockMain').hidden = false; $('#lockForgotBox').hidden = true; });
  $('#lockErase').addEventListener('click', () => { hideLock(); eraseAll(); });

  // Lifecycle
  document.addEventListener('visibilitychange', () => {
    if (document.hidden){ hiddenAt = Date.now(); clearTimeout(cloudTimer); cloudAutoRun(); return; }
    const n = processRecurring();
    render();
    refreshRate(false);
    if (n) toast(t('repeats_added', {n}));
    if (db.settings.pinHash && $('#lock').hidden && hiddenAt && Date.now() - hiddenAt > 60000) showLock('unlock');
  });
  window.addEventListener('storage', e => { if (e.key === KEY){ load(); lang = db.settings.lang; fmtCache = null; applyI18n(); applyTheme(); render(); } });
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateThemeColor); } catch(e){}
}

/* ================= Start ================= */
load();
lang = db.settings.lang || 'en';
if (!storageOK) $('#storageBanner').hidden = false;
fillCurrency($('#currencySel'));
applyI18n();
applyTheme();
bind();
const added = db.settings.setup ? processRecurring() : 0;
showView('home');
if (db.settings.pinHash) showLock('unlock');
if (!db.settings.setup) openSetup();
if (added) toast(t('repeats_added', {n:added}));
if (db.settings.cloud) preloadGis();
refreshRate(false);
window.addEventListener('online', () => refreshRate(false));
save(true);

})();

  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
