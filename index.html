}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 4px}
.brand{display:flex;align-items:center;gap:9px}
.brand-text{display:flex;flex-direction:column;gap:3px}
.brand-sub{font-size:11px;font-weight:600;color:var(--dim);line-height:1;padding-left:2px}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;flex:none}
.icon-btn:disabled{opacity:.3;cursor:default}
.icon-btn svg{width:19px;height:19px}

.monthbar{display:flex;align-items:center;gap:6px;margin:8px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px}
.monthbar .icon-btn{border:0;background:none;width:34px;height:34px}
.month-label{flex:1;text-align:center;font-weight:600;font-size:14px}

.banner{margin:10px 0 0;padding:12px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--warn);font-size:13px}

/* Hero */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:18px 16px 16px;box-shadow:var(--shadow);margin-top:12px}
.gauge{display:block;position:relative;width:100%;max-width:320px;margin:0 auto;background:none;border:0;padding:0;border-radius:20px}
.gauge svg{display:block;width:100%;height:auto;overflow:visible}
.arc-track{fill:none;stroke:var(--surface-2);stroke-width:12;stroke-linecap:round}
.arc-fill{fill:none;stroke:url(#zg);stroke-width:12;stroke-linecap:round;transition:stroke-dasharray .7s cubic-bezier(.25,.8,.25,1)}
.sun-g{transition:transform .7s cubic-bezier(.25,.8,.25,1)}
.sun{fill:var(--accent)}
.sun-halo{fill:var(--accent);opacity:.2}
.tick{stroke:var(--text);stroke-width:2;stroke-linecap:round;opacity:.4}
.over .arc-fill{stroke:var(--danger)}
.over .sun,.over .sun-halo{fill:var(--danger)}
.gauge-center{position:absolute;left:10%;right:10%;bottom:0;display:flex;flex-direction:column;align-items:center;text-align:center}
.gauge-label{font-size:12px;color:var(--dim)}
.gauge-amount{font-size:clamp(26px,8vw,34px);font-weight:700;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.gauge-amount.long{font-size:clamp(22px,6.6vw,27px)}
.gauge-amount.xlong{font-size:clamp(18px,5.4vw,22px)}
.gauge-sub{font-size:12px;color:var(--dim);margin-top:2px}
.over .gauge-amount{color:var(--danger)}
.pace{display:flex;align-items:flex-start;justify-content:center;gap:8px;margin:14px auto 0;max-width:38ch;font-size:13px;color:var(--dim);text-align:center;line-height:1.45}
.pace::before{content:'';flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--dim)}
.pace[data-tone="good"]::before{background:var(--success)}
.pace[data-tone="warn"]::before{background:var(--warn)}
.pace[data-tone="bad"]::before{background:var(--danger)}
.pace[data-tone=""]::before{display:none}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.stat span{display:block;font-size:11.5px;color:var(--dim)}
.stat strong{display:block;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{color:var(--success)}
.neg{color:var(--danger)}

/* Wallet strip */
.wallets{display:flex;gap:10px;overflow-x:auto;margin:0 -18px;padding:2px 18px 4px;scrollbar-width:none;scroll-snap-type:x proximity}
.wallets::-webkit-scrollbar{display:none}
.wallets{scroll-padding-left:18px;scroll-padding-right:18px}
.wallet{flex:none;min-width:136px;max-width:190px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;text-align:left;scroll-snap-align:start}
.wallet span{display:block;font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wallet strong{display:block;font-size:15px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.wallet .alt{margin-top:1px}
.alt{display:block;font-size:11px;font-weight:500;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt-stack{display:flex;flex-direction:column;align-items:flex-end;min-width:0}
.gauge-alt{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;margin-top:-1px}
.w-hero{text-align:center}
.w-hero .donut-box{width:200px;margin:4px auto 6px}
.w-total{font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:4px 0 0}
.w-warn{display:flex;gap:10px;align-items:flex-start;text-align:left;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--surface-2);font-size:13px;line-height:1.45}
.w-warn::before{content:'!';flex:none;width:20px;height:20px;border-radius:50%;background:var(--warn);color:#fff;font-weight:700;display:grid;place-items:center;font-size:12px}
.grp-sub{text-align:right;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.grp-sub.neg{color:var(--danger)}
.grp-sub .alt{font-weight:400}
details.hidden-w summary{cursor:pointer;color:var(--dim);font-size:13px;font-weight:600;margin:22px 4px 10px;list-style:none}
details.hidden-w summary::-webkit-details-marker{display:none}
.wd-bal{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:0}
.mini-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0 4px}
.mini-stats div{background:var(--surface-2);border-radius:14px;padding:10px}
.mini-stats span{display:block;font-size:11.5px;color:var(--dim)}
.mini-stats strong{display:block;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mini-select{max-width:48%;padding:7px 10px;font-size:13px;border-radius:10px;background:var(--surface-2);border:0}
.chips.tight{margin:12px 0 4px}
.chips.tight .chip{padding:6px 12px;font-size:12.5px}
.chart-wrap{position:relative;margin-top:8px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart-wrap svg{display:block;width:100%;height:auto;overflow:visible}
.chart-line{fill:none;stroke:var(--primary);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart-zero{stroke:var(--danger);stroke-width:1;stroke-dasharray:4 4;opacity:.7}
.chart-grid{stroke:var(--line);stroke-width:1}
.chart-guide{stroke:var(--dim);stroke-width:1;opacity:.6}
.chart-dot{fill:var(--primary);stroke:var(--surface);stroke-width:2}
.chart-tip{position:absolute;top:-4px;transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:11.5px;padding:5px 8px;border-radius:8px;white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums}
.chart-x{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:6px}
.wallet.add{min-width:auto;display:grid;place-items:center;color:var(--primary);font-weight:600;font-size:13px;border-style:dashed;padding:12px 18px}

/* Sections and lists */
.sec-head{display:flex;justify-content:space-between;align-items:center;margin:24px 2px 10px}
.sec-head h2{font-size:16px;font-weight:600;margin:0}
.link-btn{background:none;border:0;color:var(--primary);font-weight:600;font-size:13px;padding:6px 4px;border-radius:8px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.list > .tx + .tx,.list > .rrow + .rrow,.list > .brow + .brow{border-top:1px solid var(--line)}
.day + .day{border-top:1px solid var(--line)}
.day-head{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);padding:12px 16px 4px}
.day .tx + .tx{border-top:1px solid var(--line)}
.tx{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;background:none;border:0;text-align:left}
.tx:active{background:var(--surface-2)}
.tx-ico{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:19px;background:var(--surface-2);background:color-mix(in srgb,var(--c) 18%,transparent)}
.tx-main{flex:1;min-width:0}
.tx-name{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{display:block;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-amt{font-weight:600;font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx-amt.in{color:var(--success)}
.tx-amt.mv{color:var(--dim)}
.empty{padding:28px 20px;text-align:center;color:var(--dim);font-size:14px}
.empty p{margin:0}
.rrow{display:flex;align-items:center;gap:12px;padding:12px 16px}
.rrow-end{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.rrow-btns{display:flex;gap:6px}
.pill-btn{border:0;border-radius:10px;padding:6px 11px;font-size:12.5px;font-weight:600;background:var(--primary);color:var(--on-primary)}
.pill-btn.soft{background:var(--surface-2);color:var(--text)}

/* Bars and budget rows */
.bar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--primary);transition:width .5s ease}
.bar i.good{background:var(--success)}
.bar i.warn{background:var(--warn)}
.bar i.bad{background:var(--danger)}
.brow{display:block;width:100%;padding:14px 16px;background:none;border:0;text-align:left}
.brow-top{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.brow-e{font-size:18px;width:24px;text-align:center;flex:none}
.brow-name{flex:1;min-width:0;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow-amt{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.brow-amt b{color:var(--text);font-weight:600}
.brow-sub{font-size:12px;color:var(--dim);margin-top:7px}
.brow.nolimit .brow-top{margin-bottom:0}
.brow-sub.bad{color:var(--danger)}
.hint{font-size:12.5px;color:var(--dim);margin:6px 2px 10px;line-height:1.5}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;font-size:14.5px;cursor:pointer}
.toggle-row.pad{margin:0;padding:14px 16px;border-top:1px solid var(--line)}
.switch{-webkit-appearance:none;appearance:none;flex:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .2s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch:checked{background:var(--success)}
.switch:checked::after{transform:translateX(18px)}

/* Activity */
.field{width:100%;background:var(--surface-2);border:1px solid transparent;border-radius:14px;padding:13px 14px;font-size:16px;outline:none}
.field:focus{border-color:var(--primary)}
select.field{appearance:auto}
input[type="search"].field{-webkit-appearance:none;appearance:none;background:var(--surface);border-color:var(--line);margin-top:12px}
input[type="search"].field:focus{border-color:var(--primary)}
.chips{display:flex;gap:8px;margin:12px 0;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.act-tools{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.act-tools select{flex:1;min-width:0;padding:9px 12px;font-size:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.act-tools .seg{margin-left:auto}
.sumrow{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--dim);margin:0 4px 10px}
.sumrow b{color:var(--text);font-weight:600}
.sumrow b.pos{color:var(--success)}
.sumrow b.neg{color:var(--danger)}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:10px;margin-bottom:12px}
.cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal-head span{font-size:11px;color:var(--dim);text-align:center;padding:4px 0 6px}
.cal-day{min-height:50px;border:0;background:none;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 0 4px;gap:2px;font-size:13px;font-weight:500;position:relative}
.cal-day small{font-size:9.5px;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap;opacity:.8}
.cal-day.l1{background:var(--surface-2)}
.cal-day.l2{background:color-mix(in srgb,var(--primary) 18%,var(--surface))}
.cal-day.l3{background:color-mix(in srgb,var(--primary) 34%,var(--surface))}
.cal-day.today{box-shadow:inset 0 0 0 1.5px var(--primary)}
.cal-day[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.cal-day[aria-pressed="true"] small{color:var(--on-primary)}
.cal-day .dot{position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--success)}
.cal-pad{min-height:50px}

/* Insights */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:12px}
.card.flush{padding:0;overflow:hidden}
.card-title{font-size:15px;font-weight:600;margin:0}
.donut-box{position:relative;width:180px;margin:12px auto 18px}
.donut{display:block;width:100%;height:auto}
.donut-track{fill:none;stroke:var(--surface-2);stroke-width:16}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut-center strong{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.donut-center span{font-size:11.5px;color:var(--dim)}
.legend{display:flex;flex-direction:column;gap:14px}
.leg{display:grid;grid-template-columns:28px minmax(0,1fr) auto;column-gap:10px;row-gap:6px;align-items:center}
.leg-e{font-size:18px;text-align:center}
.leg-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg-amt{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.leg-pct{color:var(--dim);font-weight:400;font-size:12px;margin-left:6px}
.leg-bar{grid-column:2 / 4;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.leg-bar i{display:block;height:100%;border-radius:3px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.fact span{display:block;font-size:12px;color:var(--dim)}
.fact strong{display:block;font-size:17px;font-weight:600;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.fact small{display:block;font-size:12px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;height:160px;margin-top:16px}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;background:none;border:0;padding:4px 0 0;border-radius:10px}
.bar-col.cur{background:var(--surface-2)}
.bar-pair{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}
.b{width:30%;max-width:14px;min-height:2px;border-radius:5px 5px 2px 2px}
.b.in{background:var(--success)}
.b.out{background:var(--primary)}
.bar-lbl{font-size:11px;color:var(--dim);padding-bottom:4px}
.bar-col.cur .bar-lbl{color:var(--text);font-weight:600}
.bar-legend{display:flex;gap:16px;font-size:12px;color:var(--dim);margin-top:12px}
.bar-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Settings */
.set-h{font-size:13px;font-weight:600;color:var(--dim);margin:22px 6px 8px}
.set-list{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.set-row{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:12px 16px;background:none;border:0;text-align:left;font-size:14.5px}
.set-row + .set-row{border-top:1px solid var(--line)}
.set-row > span:first-child{flex:1}
.set-row .val{color:var(--dim);font-size:14px;font-variant-numeric:tabular-nums}
button.set-row::after{content:'›';color:var(--dim);font-size:20px;line-height:1}
button.set-row.is-static::after{content:none}
.nudge{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--warn);font-size:13px}
.nudge span{flex:1}
.set-row.danger-text{color:var(--danger)}
label.set-row{cursor:pointer}
.set-row select{-webkit-appearance:none;appearance:none;border:0;background:transparent;color:var(--dim);font-size:14px;max-width:60%;text-align:right;text-align-last:right;padding:4px 0;outline:none}
.set-row.stack{flex-wrap:wrap;gap:10px}
.set-row.stack .seg{flex:1 1 100%}
.set-note{font-size:12.5px;color:var(--dim);margin:10px 6px 0;line-height:1.5}

/* Segmented controls */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:14px;padding:4px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg button{border:0;background:none;padding:10px 6px;border-radius:11px;font-weight:600;font-size:14px;color:var(--dim);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.seg.small{min-width:0}
.seg.small button{padding:7px 10px;font-size:13px}
.plan-seg{margin-top:12px}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-inner{max-width:520px;margin:0 auto;height:66px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--dim);font-size:10.5px;font-weight:500;padding:6px 0;min-width:0}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--text)}
.fab{justify-self:center;width:56px;height:56px;border-radius:19px;border:0;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;transform:translateY(-12px);box-shadow:0 10px 24px rgba(75,77,219,.38)}
.fab svg{width:26px;height:26px}
.fab:active{transform:translateY(-12px) scale(.95)}

/* Sheets */
.scrim{position:fixed;inset:0;z-index:100;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:opacity .22s,visibility 0s .22s}
.scrim.open{opacity:1;visibility:visible;transition:opacity .22s}
.sheet{width:100%;max-width:520px;max-height:92%;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 20px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);outline:none}
.scrim.open .sheet{transform:none}
.grabber{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px}
.sheet h3{margin:0 0 16px;font-size:19px;font-weight:700}
.sheet-note{font-size:13.5px;color:var(--dim);margin:-8px 0 16px;line-height:1.5}
.lbl{display:block;font-size:12.5px;color:var(--dim);margin:16px 0 6px}
.amount-wrap{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);padding:2px}
.amount-wrap:focus-within{border-color:var(--primary)}
.cur{font-size:16px;font-weight:600;color:var(--dim);white-space:nowrap}
.amount-input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:32px;font-weight:700;padding:6px 0;font-variant-numeric:tabular-nums}
.amount-input:focus-visible{outline:none}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.wtypes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px;border:1px solid var(--line);background:var(--surface);border-radius:14px;font-size:11px;line-height:1.2;text-align:center;min-width:0;overflow:hidden}
.cat .e{font-size:20px}
.cat[aria-pressed="true"]{border-color:var(--primary);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--primary)}
.emojis{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.emo{border:1px solid var(--line);background:var(--surface);border-radius:10px;font-size:19px;padding:6px 0;line-height:1.2}
.emo[aria-pressed="true"]{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);background:var(--surface-2)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.row2 > div{min-width:0}
input[type="date"].field{min-height:50px}
textarea.field{min-height:130px;resize:vertical;font-size:12.5px;line-height:1.4}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:10px 0 0}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-weight:600;font-size:15.5px;text-align:center;background:var(--primary);color:var(--on-primary);margin-top:14px}
.btn.secondary{background:var(--surface-2);color:var(--text)}
.btn.ghost{background:transparent;color:var(--dim);margin-top:4px}
.btn.danger{background:var(--danger);color:#fff}
.btn.outline-danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.small{display:inline-block;width:auto;padding:10px 18px;font-size:14px;margin-top:14px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-row .btn{margin-top:14px}
.center{text-align:center}
.fee-row{display:flex;align-items:center;gap:10px}
.fee-row .field{flex:1;min-width:0}
.wrow{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) 40px;gap:8px;margin-top:8px;align-items:center}
.wrow .field{padding:11px 12px;font-size:15px}
.wrow .icon-btn{width:40px;height:44px;background:none;border:0;color:var(--dim);font-size:20px}
.mini-list{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:6px}
.mini-row{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:14px}
.mini-row + .mini-row{border-top:1px solid var(--line)}
.mini-row span:nth-child(2){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-row .x{border:0;background:none;color:var(--danger);font-weight:600;font-size:13px;padding:4px 6px}
.imp-drop{border:1.5px dashed var(--line);border-radius:16px;padding:20px 14px;text-align:center;margin-top:4px}
.imp-drop.over{border-color:var(--primary);background:var(--surface-2)}
.imp-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}
.imp-stat{background:var(--surface-2);border-radius:14px;padding:11px}
.imp-stat span{display:block;font-size:11.5px;color:var(--dim)}
.imp-stat strong{display:block;font-size:16px;font-weight:600;margin-top:2px}
.imp-list{font-size:13px;color:var(--dim);line-height:1.6;margin:0 0 4px}
.imp-list b{color:var(--text);font-weight:600}
.goal-big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0 8px}

/* Lock */
.lock{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));text-align:center}
.lock .logo-em{width:56px;height:56px;margin-bottom:12px}
.lock-title{font-size:17px;font-weight:600;margin:0}
.pin-dots{display:flex;gap:16px;margin:20px 0 8px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--dim)}
.pin-dots i.on{background:var(--text);border-color:var(--text)}
.pin-dots.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.lock-err{color:var(--danger);font-size:13px;min-height:20px;margin:6px 0 14px}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.key{width:72px;height:72px;border-radius:50%;border:0;background:var(--surface);font-size:24px;font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.key:active{background:var(--surface-2)}
.key.blank{visibility:hidden}
.key.fn{background:none;box-shadow:none;font-size:22px;color:var(--dim)}
.lock-links{display:flex;gap:18px;margin-top:18px}
.lock-forgot{max-width:340px}
.lock-forgot p{color:var(--dim);font-size:14px;line-height:1.5}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:250;display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);padding:11px 16px;border-radius:14px;background:var(--text);color:var(--bg);font-size:14px;opacity:0;transform:translate(-50%,16px);transition:opacity .22s,transform .22s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.show.interactive{pointer-events:auto}
.toast button{background:none;border:0;color:var(--accent);font-weight:700;padding:2px 4px;filter:brightness(.85)}


/* ================= Rich look ================= */
:root[data-look="rich"]:not([data-theme="dark"]){
  --bg:#ECEEF8; --surface:rgba(255,255,255,.72); --surface-2:rgba(30,34,90,.06); --line:rgba(30,34,90,.09);
  --primary:#5557F0; --accent:#0AA7BD; --shadow:0 18px 40px -20px rgba(40,44,120,.32);
  --sheet:#FFFFFF; --bar:rgba(247,248,254,.8);
}
@media (prefers-color-scheme: dark){
  :root[data-look="rich"]:not([data-theme="light"]){
    --bg:#06070E; --surface:rgba(255,255,255,.055); --surface-2:rgba(255,255,255,.09); --line:rgba(255,255,255,.085);
    --primary:#7C7EFF; --accent:#3FE8F7; --shadow:0 22px 50px -22px rgba(0,0,0,.75);
    --sheet:#10121E; --bar:rgba(8,9,18,.74);
  }
}
:root[data-look="rich"][data-theme="dark"]{
  --bg:#06070E; --surface:rgba(255,255,255,.055); --surface-2:rgba(255,255,255,.09); --line:rgba(255,255,255,.085);
  --primary:#7C7EFF; --accent:#3FE8F7; --shadow:0 22px 50px -22px rgba(0,0,0,.75);
  --sheet:#10121E; --bar:rgba(8,9,18,.74);
}
:root[data-look="rich"] body{background:transparent}
:root[data-look="rich"] body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(65% 38% at 12% -4%, color-mix(in srgb,var(--primary) 30%, transparent), transparent 72%),
    radial-gradient(55% 34% at 104% 16%, color-mix(in srgb,var(--accent) 17%, transparent), transparent 72%),
    radial-gradient(80% 40% at 50% 108%, color-mix(in srgb,var(--primary) 15%, transparent), transparent 72%)}
:root[data-look="rich"] :is(.hero,.card,.list,.set-list,.fact,.cal,.mini-list,.monthbar,.nudge,.w-warn){
  background:var(--surface);border-color:var(--line);
  -webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.07)}
:root[data-look="rich"] .hero{border-radius:32px;
  background:linear-gradient(165deg,color-mix(in srgb,var(--primary) 18%,var(--surface)),var(--surface) 58%)}
:root[data-look="rich"] .sheet{background:var(--sheet);border-top:1px solid var(--line)}
:root[data-look="rich"] .tabbar{background:var(--bar);border-top-color:var(--line);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%)}
:root[data-look="rich"] .gauge-amount{font-size:clamp(30px,9vw,40px);font-weight:700;letter-spacing:-.035em}
:root[data-look="rich"] .gauge-amount.long{font-size:clamp(24px,7vw,31px)}
:root[data-look="rich"] .gauge-amount.xlong{font-size:clamp(19px,5.8vw,24px)}
:root[data-look="rich"] .arc-fill{filter:drop-shadow(0 0 7px color-mix(in srgb,var(--accent) 60%,transparent))}
:root[data-look="rich"] .sun{filter:drop-shadow(0 0 7px var(--accent))}
:root[data-look="rich"] .sun-halo{opacity:.38}
:root[data-look="rich"] .fab{background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--accent) 65%,var(--primary)));
  box-shadow:0 14px 30px -8px color-mix(in srgb,var(--primary) 75%,transparent), inset 0 1px 0 rgba(255,255,255,.4)}
:root[data-look="rich"] .btn:not(.secondary):not(.ghost):not(.danger):not(.outline-danger){
  background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--accent) 55%,var(--primary)));
  box-shadow:0 10px 24px -10px color-mix(in srgb,var(--primary) 80%,transparent), inset 0 1px 0 rgba(255,255,255,.3)}
:root[data-look="rich"] .pill-btn:not(.soft){background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--accent) 55%,var(--primary)))}
:root[data-look="rich"] .seg button[aria-pressed="true"]{background:color-mix(in srgb,var(--primary) 30%,transparent);color:var(--text);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--primary) 55%,transparent)}
:root[data-look="rich"] .bar i{background:linear-gradient(90deg,var(--primary),var(--accent))}
:root[data-look="rich"] .bar i.good{background:linear-gradient(90deg,color-mix(in srgb,var(--success) 70%,var(--accent)),var(--success))}
:root[data-look="rich"] .bar i.warn{background:linear-gradient(90deg,var(--warn),color-mix(in srgb,var(--warn) 70%,#fff))}
:root[data-look="rich"] .bar i.bad{background:linear-gradient(90deg,var(--danger),color-mix(in srgb,var(--danger) 70%,#fff))}
:root[data-look="rich"] .tx-ico{border-radius:15px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 30%,transparent)}
:root[data-look="rich"] .wallets{gap:12px}
:root[data-look="rich"] .wallet{position:relative;overflow:hidden;display:flex;flex-direction:column;min-width:172px;height:110px;padding:14px 16px;
  border:1px solid rgba(255,255,255,.18);border-radius:24px;color:#fff;
  background:linear-gradient(135deg,color-mix(in srgb,var(--wc,#6366F1) 90%,#12142A),color-mix(in srgb,var(--wc,#6366F1) 38%,#090A16));
  box-shadow:0 16px 30px -16px color-mix(in srgb,var(--wc,#6366F1) 75%,#000), inset 0 1px 0 rgba(255,255,255,.28);
  -webkit-backdrop-filter:none;backdrop-filter:none}
:root[data-look="rich"] .wallet::after{content:'';position:absolute;right:-34px;top:-46px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.26),transparent 66%);pointer-events:none}
:root[data-look="rich"] .wallet span,:root[data-look="rich"] .wallet .alt{color:rgba(255,255,255,.8)}
:root[data-look="rich"] .wallet strong{color:#fff;font-size:17px;margin-top:auto}
:root[data-look="rich"] .wallet strong.neg{color:#FFB9B3}
:root[data-look="rich"] .wallet.add{min-width:104px;background:transparent;color:var(--primary);border:1.5px dashed var(--line);box-shadow:none;
  align-items:center;justify-content:center}
:root[data-look="rich"] .wallet.add::after{display:none}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>

<body>

<div class="app">
  <div class="banner" id="storageBanner" hidden data-i18n="storage_banner"></div>

  <header class="top">
    <div class="brand" role="img" aria-label="Asafamz Budget">
      <span class="mk logo-em"></span>
      <span class="brand-text"><span class="mk logo-wm"></span><span class="brand-sub">Budget</span></span>
    </div>
    <button class="icon-btn" id="settingsBtn" data-i18n-aria="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
    </button>
  </header>

  <div class="monthbar" id="monthNav">
    <button class="icon-btn" id="prevMonth" data-i18n-aria="prev_month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <span class="month-label" id="monthLabel" aria-live="polite"></span>
    <button class="icon-btn" id="nextMonth" data-i18n-aria="next_month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
  </div>

  <main>
    <!-- Home -->
    <section class="view" id="view-home">
      <div class="hero" id="hero">
        <button class="gauge" id="gaugeBtn" data-i18n-aria="edit_budget">
          <svg viewBox="0 0 240 132" aria-hidden="true">
            <defs>
              <linearGradient id="zg" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" style="stop-color:var(--primary)"/>
                <stop offset="1" style="stop-color:var(--accent)"/>
              </linearGradient>
            </defs>
            <path class="arc-track" d="M20 120 A100 100 0 0 1 220 120" pathLength="100"/>
            <path class="arc-fill" id="arcFill" d="M20 120 A100 100 0 0 1 220 120" pathLength="100" stroke-dasharray="0 100"/>
            <line class="tick" id="paceTick" x1="0" y1="0" x2="0" y2="0"/>
            <g class="sun-g" id="sunG" style="transform:translate(20px,120px)">
              <circle class="sun-halo" r="13"/>
              <circle class="sun" r="7"/>
            </g>
          </svg>
          <span class="gauge-center">
            <span class="gauge-label" id="gLabel"></span>
            <span class="gauge-amount" id="gAmount"></span>
            <span class="gauge-alt" id="gAlt"></span>
            <span class="gauge-sub" id="gSub"></span>
          </span>
        </button>
        <p class="pace" id="pace" data-tone=""></p>
        <div class="stats">
          <div class="stat"><span data-i18n="balance"></span><strong id="sBalance"></strong><small class="alt" id="aBalance"></small></div>
          <div class="stat"><span data-i18n="income"></span><strong id="sIncome" class="pos"></strong><small class="alt" id="aIncome"></small></div>
          <div class="stat"><span data-i18n="spent"></span><strong id="sSpent"></strong><small class="alt" id="aSpent"></small></div>
        </div>
      </div>

      <div class="nudge" id="cloudNudge" hidden><span data-i18n="cloud_nudge"></span><button class="pill-btn" id="nudgeBackup" data-i18n="cloud_backup_now"></button></div>

      <div class="sec-head"><h2 data-i18n="wallets"></h2><button class="link-btn" id="manageWallets" data-i18n="see_all"></button></div>
      <div class="wallets" id="walletStrip"></div>

      <div id="homeBills"></div>
      <div id="homeBudgets"></div>

      <div class="sec-head"><h2 data-i18n="recent"></h2><button class="link-btn" data-go="activity" data-i18n="see_all"></button></div>
      <div class="list" id="recentList"></div>
    </section>

    <!-- Activity -->
    <section class="view" id="view-activity" hidden>
      <input class="field" type="search" id="search" data-i18n-ph="search_tx" data-i18n-aria="search_tx" autocomplete="off">
      <div class="chips" role="group" id="typeChips">
        <button class="chip" data-filter="all" aria-pressed="true" data-i18n="all"></button>
        <button class="chip" data-filter="expense" aria-pressed="false" data-i18n="spending"></button>
        <button class="chip" data-filter="income" aria-pressed="false" data-i18n="income"></button>
        <button class="chip" data-filter="transfer" aria-pressed="false" data-i18n="transfers"></button>
      </div>
      <div class="act-tools">
        <select id="walletFilter" data-i18n-aria="wallet"></select>
        <div class="seg small" id="modeSeg" role="group">
          <button data-mode="list" data-i18n="list"></button>
          <button data-mode="calendar" data-i18n="calendar"></button>
        </div>
      </div>
      <div id="calWrap"></div>
      <div class="sumrow" id="histSum"></div>
      <div class="list" id="histList"></div>
    </section>

    <!-- Plan -->
    <section class="view" id="view-plan" hidden>
      <div class="seg three plan-seg" id="planSeg" role="group">
        <button data-plan="budgets" data-i18n="budgets"></button>
        <button data-plan="goals" data-i18n="goals"></button>
        <button data-plan="repeats" data-i18n="repeats"></button>
      </div>
      <div id="planBody"></div>
    </section>

    <!-- Insights -->
    <!-- Wallets -->
    <section class="view" id="view-wallets" hidden>
      <div class="card w-hero" id="wHero"></div>
      <div id="wGroups"></div>
      <div class="btn-row">
        <button class="btn secondary" data-action="add-wallet" id="wAddBtn"></button>
        <button class="btn secondary" data-action="transfer" id="wTransferBtn"></button>
      </div>
    </section>

    <section class="view" id="view-insights" hidden>
      <div class="card">
        <div class="card-head"><h2 class="card-title" data-i18n="balance_over_time"></h2><select id="balWallet" class="mini-select" data-i18n-aria="wallet"></select></div>
        <div class="chips tight" id="rangeChips" role="group">
          <button class="chip" data-range="1M">1M</button><button class="chip" data-range="3M">3M</button><button class="chip" data-range="6M">6M</button><button class="chip" data-range="1Y">1Y</button><button class="chip" data-range="ALL" data-i18n="range_all"></button>
        </div>
        <div id="balChart"></div>
      </div>
      <div class="card">
        <h2 class="card-title" data-i18n="where_went"></h2>
        <div id="donutWrap"></div>
      </div>
      <div class="facts" id="facts"></div>
      <div class="card">
        <h2 class="card-title" data-i18n="last_6"></h2>
        <div id="trend"></div>
      </div>
    </section>

    <!-- Settings -->
    <section class="view" id="view-settings" hidden>
      <h2 class="set-h" data-i18n="general"></h2>
      <div class="set-list">
        <div class="set-row stack"><span data-i18n="language"></span>
          <div class="seg small" id="langSeg" role="group"><button data-lang="en">English</button><button data-lang="sw">Kiswahili</button></div>
        </div>
        <label class="set-row"><span data-i18n="currency"></span><select id="currencySel" data-i18n-aria="currency"></select></label>
        <label class="set-row"><span data-i18n="second_currency"></span><select id="secondSel" data-i18n-aria="second_currency"></select></label>
        <button class="set-row" id="rowRate" hidden><span data-i18n="exchange_rate"></span><span class="val" id="valRate"></span></button>
        <label class="set-row" id="rowRateAuto" hidden><span data-i18n="auto_rate"></span><input type="checkbox" class="switch" id="rateAutoSwitch"></label>
        <div class="set-row stack"><span data-i18n="theme"></span>
          <div class="seg three small" id="themeSeg" role="group">
            <button data-theme-opt="system" data-i18n="theme_auto"></button>
            <button data-theme-opt="light" data-i18n="theme_light"></button>
            <button data-theme-opt="dark" data-i18n="theme_dark"></button>
          </div>
        </div>
        <div class="set-row stack"><span data-i18n="look"></span>
          <div class="seg small" id="lookSeg" role="group"><button data-look-opt="rich" data-i18n="look_rich"></button><button data-look-opt="classic" data-i18n="look_classic"></button></div>
        </div>
      </div>
      <p class="set-note"><span data-i18n="currency_note"></span> <span data-i18n="second_note"></span></p>
      <p class="set-note" id="rateNote" hidden></p>

      <h2 class="set-h" data-i18n="money"></h2>
      <div class="set-list">
        <button class="set-row" id="rowWallets"><span data-i18n="wallets"></span><span class="val" id="valWallets"></span></button>
        <button class="set-row" id="rowCats"><span data-i18n="categories"></span><span class="val" id="valCats"></span></button>
        <button class="set-row" id="rowBudget"><span data-i18n="monthly_budget"></span><span class="val" id="valBudget"></span></button>
      </div>

      <h2 class="set-h" data-i18n="security"></h2>
      <div class="set-list">
        <label class="set-row"><span data-i18n="app_lock"></span><input type="checkbox" class="switch" id="pinSwitch"></label>
        <button class="set-row" id="rowChangePin" hidden><span data-i18n="change_pin"></span></button>

      <p class="set-note" data-i18n="pin_note"></p>

      <div id="cloudSection" hidden>
        <h2 class="set-h" data-i18n="cloud_backup"></h2>

          <button class="set-row" id="rowCloudConnect"><span data-i18n="cloud_account"></span><span class="val" id="valCloud"></span></button>

          <button class="set-row" id="rowCloudRestore" hidden><span data-i18n="cloud_restore"></span></button>
          <label class="set-row" id="rowCloudAuto" hidden><span data-i18n="cloud_auto"></span><input type="checkbox" class="switch" id="cloudAutoSwitch"></label>
          <button class="set-row danger-text" id="rowCloudDisconnect" hidden><span data-i18n="cloud_disconnect"></span></button>
        </div>
        <p class="set-note" data-i18n="cloud_note"></p>
      </div>

      <h2 class="set-h" data-i18n="your_data"></h2>
      <div class="set-list">
        <button class="set-row" id="rowCsv"><span data-i18n="export_csv"></span><span class="val">CSV</span></button>
        <button class="set-row" id="rowBackup"><span data-i18n="backup"></span></button>
        <button class="set-row" id="rowImportBudge"><span data-i18n="import_budge"></span></button>
        <button class="set-row" id="rowRestore"><span data-i18n="restore"></span></button>
        <button class="set-row danger-text" id="rowErase"><span data-i18n="erase_all"></span></button>
      </div>
      <p class="set-note" data-i18n="data_note"></p>
      <p class="set-note">Asafamz Budget 2.0</p>
    </section>
  </main>
</div>

<nav class="tabbar" aria-label="Main">
  <div class="tabbar-inner">
    <button class="tab" data-view="home" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span data-i18n="home"></span>
    </button>
    <button class="tab" data-view="activity">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
      <span data-i18n="activity"></span>
    </button>
    <button class="fab" id="addBtn" data-i18n-aria="add_tx">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="tab" data-view="plan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>
      <span data-i18n="plan"></span>
    </button>
    <button class="tab" data-view="insights">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M11 20V5M17 20v-7M3 20h18"/></svg>
      <span data-i18n="insights"></span>
    </button>
  </div>
</nav>

<!-- Transaction / repeat sheet -->
<div class="scrim" id="txSheet" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="txTitle" tabindex="-1">

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function pad(n){ return String(n).padStart(2,'0'); }
function iso(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function todayISO(){ return iso(new Date()); }
function currentMonth(){ return todayISO().slice(0,7); }
function parseISO(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function isISO(s){ return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(parseISO(s)); }
function addDays(s, n){ const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); }
function daysBetween(a, b){ return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
function shiftMonth(key, delta){ const [y,m] = key.split('-').map(Number); return iso(new Date(y, m-1+delta, 1)).slice(0,7); }
function daysInMonth(key){ const [y,m] = key.split('-').map(Number); return new Date(y, m, 0).getDate(); }
function monthLabel(key, opts){ const [y,m] = key.split('-').map(Number); return new Date(y, m-1, 1).toLocaleDateString(loc(), opts || {month:'long', year:'numeric'}); }
function dateLabel(s){
  const d = parseISO(s);
  const opts = {day:'numeric', month:'short'};
  if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
  return d.toLocaleDateString(loc(), opts);
}
function dayLabel(s){
  if (s === todayISO()) return t('today');
  if (s === addDays(todayISO(), -1)) return t('yesterday');
  const d = parseISO(s);
  const opts = {weekday:'short', day:'numeric', month:'short'};
  if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
  return d.toLocaleDateString(loc(), opts);
}
function dword(n){ return n === 1 ? t('day') : t('days'); }

function guessCurrency(){
  try {
    const langs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ''];
    for (const l of langs){
      const parts = String(l).split('-');
      const r = (parts[parts.length-1] || '').toUpperCase();
      if (REGION_CUR[r]) return REGION_CUR[r];
      if (EURO.includes(r)) return 'EUR';
    }
  } catch(e){}
  return 'USD';
}
function guessLang(){
  try { return /^sw/i.test(navigator.language || '') ? 'sw' : 'en'; } catch(e){ return 'en'; }
}

function blankDB(){

    settings:{currency:guessCurrency(), budget:0, theme:'system', setup:false, lang:guessLang(), rollover:false, pinHash:null, pinSalt:null, lastWallet:null, cloud:null, second:null, look:'rich'},
    wallets:[], tx:[], cats:[], catBudgets:{}, recurring:[], goals:[]
  };
}
function num(v, d){ const n = Number(v); return isFinite(n) ? n : d; }
function round2(n){ return Math.round(n*100)/100; }

function validCurrency(c){
  if (typeof c !== 'string' || !/^[A-Z]{3}$/.test(c)) return false;
  try { new Intl.NumberFormat('en', {style:'currency', currency:c}); return true; } catch(e){ return false; }
}
function currencyList(){
  let codes;
  try { codes = Intl.supportedValuesOf('currency'); } catch(e){ codes = null; }
  if (!codes || !codes.length) codes = CURRENCIES.map(c => c[0]);
  let dn = null;
  try { dn = new Intl.DisplayNames([lang === 'sw' ? 'sw' : 'en'], {type:'currency'}); } catch(e){}
  const known = Object.fromEntries(CURRENCIES);
  return codes.filter(validCurrency).map(c => {
    let n = null; try { n = dn && dn.of(c); } catch(e){}
    return [c, n && n !== c ? n : (known[c] || c)];
  }).sort((a,b) => a[1].localeCompare(b[1]));
}
function sanitizeSettings(s){
  const out = blankDB().settings;
  s = s || {};
  if (validCurrency(s.currency)) out.currency = s.currency;
  const b = num(s.budget, 0); if (b >= 0) out.budget = b;
  if (['system','light','dark'].includes(s.theme)) out.theme = s.theme;
  if (['en','sw'].includes(s.lang)) out.lang = s.lang;
  if (['classic','rich'].includes(s.look)) out.look = s.look;
  out.setup = !!s.setup;
  out.rollover = !!s.rollover;
  if (typeof s.pinHash === 'string' && typeof s.pinSalt === 'string'){ out.pinHash = s.pinHash; out.pinSalt = s.pinSalt; }
  if (typeof s.lastWallet === 'string') out.lastWallet = s.lastWallet;
  if (s.second && typeof s.second === 'object' && validCurrency(s.second.cur)){
    const r = num(s.second.rate, 0);
    out.second = {cur:s.second.cur, rate: r > 0 ? r : null,
      base: validCurrency(s.second.base) ? s.second.base : out.currency,
      auto: s.second.auto !== false, updated: num(s.second.updated, 0) || null};
  }
  if (s.cloud && typeof s.cloud === 'object'){
    out.cloud = {email: typeof s.cloud.email === 'string' ? s.cloud.email.slice(0,120) : null, auto: s.cloud.auto !== false,
      last: num(s.cloud.last, 0) || null, dirty: !!s.cloud.dirty};
  }
  return out;
}
function normWallet(w){
  if (!w || typeof w !== 'object') return null;
  return {
    id: (typeof w.id === 'string' && w.id) ? w.id.slice(0,40) : 'w_' + uid(),
    name: (typeof w.name === 'string' && w.name.trim()) ? w.name.trim().slice(0,30) : 'Wallet',
    type: WALLET_TYPES.some(x => x.id === w.type) ? w.type : 'other',
    opening: round2(num(w.opening, 0)),
    archived: !!w.archived
  };
}
function normTx(x, walletIds, fallback){
  if (!x || typeof x !== 'object') return null;
  const type = ['expense','income','transfer'].includes(x.type) ? x.type : null;
  const amount = num(x.amount, NaN);
  if (!type || !(amount > 0) || !isISO(x.date)) return null;
  const wallet = walletIds.has(x.wallet) ? x.wallet : fallback;
  const out = {
    id: (typeof x.id === 'string' && x.id) ? x.id.slice(0,48) : uid(),
    type, amount: round2(amount),
    cat: type === 'transfer' ? 'transfer' : (typeof x.cat === 'string' ? x.cat : 'other'),
    desc: typeof x.desc === 'string' ? x.desc.slice(0,60) : '',
    date: x.date, created: num(x.created, Date.now()), wallet
  };
  if (type === 'transfer'){
    if (!walletIds.has(x.toWallet) || x.toWallet === wallet) return null;
    out.toWallet = x.toWallet;
  }
  if (typeof x.recur === 'string') out.recur = x.recur;
  const fee = num(x.fee, 0); if (fee > 0) out.fee = round2(fee);
  if (x.adj === true && type !== 'transfer') out.adj = true;
  return out;
}
function normCat(c){
  if (!c || typeof c !== 'object' || typeof c.name !== 'string' || !c.name.trim()) return null;
  return {
    id: (typeof c.id === 'string' && c.id.startsWith('c_')) ? c.id.slice(0,40) : 'c_' + uid(),
    name: c.name.trim().slice(0,24),
    e: typeof c.e === 'string' && c.e ? c.e.slice(0,8) : '🏷️',
    c: typeof c.c === 'string' && /^#[0-9a-f]{6}$/i.test(c.c) ? c.c : PALETTE[0],
    type: c.type === 'income' ? 'income' : 'expense'
  };
}
function normRecur(r, walletIds, fallback){
  if (!r || typeof r !== 'object') return null;
  const type = ['expense','income','transfer'].includes(r.type) ? r.type : null;
  const amount = num(r.amount, NaN);
  if (!type || !(amount > 0) || !isISO(r.next)) return null;
  const out = {
    id: (typeof r.id === 'string' && r.id) ? r.id.slice(0,48) : 'r_' + uid(),
    type, amount: round2(amount),
    cat: type === 'transfer' ? 'transfer' : (typeof r.cat === 'string' ? r.cat : 'other'),
    desc: typeof r.desc === 'string' ? r.desc.slice(0,60) : '',
    wallet: walletIds.has(r.wallet) ? r.wallet : fallback,
    freq: ['weekly','monthly','yearly'].includes(r.freq) ? r.freq : 'monthly',
    next: r.next,
    dom: Math.min(31, Math.max(1, Math.round(num(r.dom, parseISO(r.next).getDate())))),
    auto: r.auto !== false,
    active: r.active !== false
  };
  const fee = num(r.fee, 0); if (fee > 0) out.fee = round2(fee);
  if (type === 'transfer'){
    if (!walletIds.has(r.toWallet) || r.toWallet === out.wallet) return null;
    out.toWallet = r.toWallet;
  }
  return out;
}
function normGoal(g){
  if (!g || typeof g !== 'object' || typeof g.name !== 'string') return null;
  const target = num(g.target, NaN);
  if (!(target > 0)) return null;
  return {
    id: (typeof g.id === 'string' && g.id) ? g.id.slice(0,48) : 'g_' + uid(),
    name: g.name.trim().slice(0,40) || 'Goal',
    e: typeof g.e === 'string' && g.e ? g.e.slice(0,8) : '🎯',
    target: round2(target),
    deadline: isISO(g.deadline) ? g.deadline : null,
    hist: Array.isArray(g.hist) ? g.hist.filter(h => h && isISO(h.d) && isFinite(Number(h.a)) && Number(h.a) !== 0).map(h => ({d:h.d, a:round2(Number(h.a))})) : [],
    created: num(g.created, Date.now())
  };
}
function migrate(d){
  if (!d || typeof d !== 'object') return null;
  const out = blankDB();
  out.settings = sanitizeSettings(d.settings);
  if (d.v === 2){
    out.wallets = (Array.isArray(d.wallets) ? d.wallets : []).map(normWallet).filter(Boolean);
    const seen = new Set(); out.wallets = out.wallets.filter(w => !seen.has(w.id) && seen.add(w.id));
  }
  if (!out.wallets.length){
    const opening = num(d.settings && d.settings.opening, 0);
    out.wallets.push({id:'w_cash', name:t('wt_cash'), type:'cash', opening:round2(opening), archived:false});
  }
  const ids = new Set(out.wallets.map(w => w.id));
  const fallback = (out.wallets.find(w => !w.archived) || out.wallets[0]).id;
  out.tx = (Array.isArray(d.tx) ? d.tx : []).map(x => normTx(x, ids, fallback)).filter(Boolean);
  if (d.v === 2){
    out.cats = (Array.isArray(d.cats) ? d.cats : []).map(normCat).filter(Boolean);
    const cb = d.catBudgets && typeof d.catBudgets === 'object' ? d.catBudgets : {};
    Object.keys(cb).forEach(k => { const v = num(cb[k], 0); if (v > 0) out.catBudgets[k] = round2(v); });
    out.recurring = (Array.isArray(d.recurring) ? d.recurring : []).map(r => normRecur(r, ids, fallback)).filter(Boolean);
    out.goals = (Array.isArray(d.goals) ? d.goals : []).map(normGoal).filter(Boolean);
  }
  if (!out.wallets.some(w => !w.archived)) out.wallets[0].archived = false;
  return out;
}

  catch(e){ f = new Intl.NumberFormat(undefined, {minimumFractionDigits:d, maximumFractionDigits:d}); }
  try { fc = new Intl.NumberFormat(loc(), {style:'currency', currency:cur, notation:'compact', maximumFractionDigits:1}); } catch(e){ fc = f; }
  try { fn = new Intl.NumberFormat(loc(), {notation:'compact', maximumFractionDigits:1}); } catch(e){ fn = new Intl.NumberFormat(); }

function fmt(n, sign){

function fmtShort(n){ const s = formatter().fc.format(Math.abs(n)); return n < 0 ? '−' + s : s; }
function fitAmt(n, max){ const f = fmt(n); return f.length > (max || 12) ? fmtShort(n) : f; }
const altCache = {};
function altFmt(n){
  const s2 = db.settings.second;

  const key = s2.cur + '|' + lang;

        c:new Intl.NumberFormat(loc(), {style:'currency', currency:s2.cur, notation:'compact', maximumFractionDigits:1})};
    } catch(e){ return ''; }
  }
  const v = n * s2.rate;

}

function parseAmount(str){

function allCats(type){

  return b.slice(0, -1).concat(custom, [b[b.length-1]]);

function catName(c){ return c.k ? t(c.k) : c.name; }
function catById(type, id){ const list = allCats(type); return list.find(c => c.id === id) || list[list.length-1]; }
const ADJ_CAT = {id:'adjust', k:'balance_correction', e:'⚖️', c:'#64748B'};
function catOf(x){ return x.adj ? ADJ_CAT : x.type === 'transfer' ? TRANSFER_CAT : catById(x.type, x.cat); }
function walletById(id){ return db.wallets.find(w => w.id === id); }
function walletName(id){ const w = walletById(id); return w ? w.name : '?'; }
function walletEmoji(w){ return (WALLET_TYPES.find(x => x.id === w.type) || WALLET_TYPES[5]).e; }
function activeWallets(){ return db.wallets.filter(w => !w.archived); }
function walletHasTx(id){ return db.tx.some(x => x.wallet === id || x.toWallet === id) || db.recurring.some(r => r.wallet === id || r.toWallet === id); }
function walletBalances(){
  const m = {};
  db.wallets.forEach(w => { m[w.id] = w.opening || 0; });
  for (const x of db.tx){
    if (!(x.wallet in m)) continue;
    if (x.type === 'income') m[x.wallet] += x.amount;
    else if (x.type === 'expense') m[x.wallet] -= x.amount;
    else { m[x.wallet] -= x.amount; if (x.toWallet in m) m[x.toWallet] += x.amount; }
    if (x.fee) m[x.wallet] -= x.fee;
  }
  return m;
}
function totalBalance(){ const m = walletBalances(); return Object.values(m).reduce((a,b) => a + b, 0); }
function monthTx(key){ return db.tx.filter(x => x.date.slice(0,7) === key); }
function totals(list){
  let inc = 0, exp = 0;
  for (const x of list){ if (x.adj) continue; if (x.type === 'income') inc += x.amount; else if (x.type === 'expense') exp += x.amount; if (x.fee) exp += x.fee; }
  return {inc, exp};
}
function sortTx(list){ return list.slice().sort((a,b) => b.date.localeCompare(a.date) || (b.created||0) - (a.created||0)); }
function firstMonth(){ let m = null; for (const x of db.tx){ const k = x.date.slice(0,7); if (!m || k < m) m = k; } return m; }
function maxMonth(){

}
function rolled(base, month, spentFn){
  if (!(base > 0)) return {base:0, eff:0, carry:0};
  if (!db.settings.rollover) return {base, eff:base, carry:0};
  const first = firstMonth();
  if (!first || month <= first) return {base, eff:base, carry:0};
  let eff = base, m = first, guard = 0;
  while (m < month && guard++ < 240){
    const carry = Math.max(0, eff - spentFn(m));
    m = shiftMonth(m, 1);
    eff = base + carry;
  }
  return {base, eff, carry: eff - base};
}
function budgetFor(month){ return rolled(db.settings.budget, month, m => totals(monthTx(m)).exp); }
function catSpent(month, catId){
  let s = 0;
  for (const x of monthTx(month)){
    if (x.adj) continue;
    if (x.type === 'expense' && catById('expense', x.cat).id === catId) s += x.amount;
    if (catId === 'fees' && x.fee) s += x.fee;
  }
  return s;
}
function outOf(x){ return x.adj ? 0 : (x.type === 'expense' ? x.amount : 0) + (x.fee || 0); }
function catBudgetFor(catId, month){ return rolled(db.catBudgets[catId] || 0, month, m => catSpent(m, catId)); }
function goalSaved(g){ return g.hist.reduce((s,h) => s + h.a, 0); }

/* ================= Recurring ================= */
function advance(r){
  const d = parseISO(r.next);
  if (r.freq === 'weekly'){ d.setDate(d.getDate() + 7); r.next = iso(d); return; }
  const y = r.freq === 'yearly' ? d.getFullYear() + 1 : d.getFullYear();
  const m = r.freq === 'yearly' ? d.getMonth() : d.getMonth() + 1;
  const dim = new Date(y, m + 1, 0).getDate();
  r.next = iso(new Date(y, m, Math.min(r.dom, dim)));
}
function txFromRecur(r, date){
  const x = {id:uid(), created:Date.now(), type:r.type, amount:r.amount, cat:r.cat, desc:r.desc, wallet:r.wallet, date, recur:r.id};
  if (r.type === 'transfer') x.toWallet = r.toWallet;
  if (r.fee) x.fee = r.fee;
  return x;
}
function processRecurring(){
  const today = todayISO(); let n = 0;
  for (const r of db.recurring){
    if (!r.active || !r.auto) continue;
    let guard = 0;
    while (r.next <= today && guard++ < 120){ db.tx.push(txFromRecur(r, r.next)); advance(r); n++; }
  }
  if (n) save();
  return n;
}
function dueRecurring(){ const today = todayISO(); return db.recurring.filter(r => r.active && !r.auto && r.next <= today).sort((a,b) => a.next.localeCompare(b.next)); }
function upcomingRecurring(days){ const today = todayISO(), lim = addDays(today, days); return db.recurring.filter(r => r.active && r.next > today && r.next <= lim).sort((a,b) => a.next.localeCompare(b.next)); }
function recurLabel(r){ return r.desc || (r.type === 'transfer' ? walletName(r.wallet) + ' → ' + walletName(r.toWallet) : catName(catById(r.type, r.cat))); }
function freqLabel(f){ return t(f === 'weekly' ? 'every_week' : f === 'yearly' ? 'every_year' : 'every_month'); }

function canAnimate(){
  try { return typeof matchMedia === 'function' && !matchMedia('(prefers-reduced-motion: reduce)').matches && typeof requestAnimationFrame === 'function' && !document.hidden; }
  catch(e){ return false; }
}
function setNum(el, value, f){
  const final = f(value), prev = el._nv;
  el._nv = value;
  if (el._raf){ try { cancelAnimationFrame(el._raf); } catch(e){} el._raf = 0; }
  el.textContent = final;
  if (db.settings.look !== 'rich' || prev == null || prev === value || !canAnimate()) return;
  const t0 = performance.now(), dur = 650;
  const step = now => {
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = p >= 1 ? final : f(prev + (value - prev) * e);
    el._raf = p < 1 ? requestAnimationFrame(step) : 0;
  };
  el._raf = requestAnimationFrame(step);
}
function haptic(){
  try { if (db.settings.look === 'rich' && navigator.vibrate) navigator.vibrate(7); } catch(e){}
}
function txRow(x, meta){

    '<span class="tx-meta">' + esc(meta) + '</span></span>' +

function groupedList(items){

function budgetRow(c, month, attr){

function weekStart(){
  try {
    const l = new Intl.Locale(navigator.language || 'en');
    const wi = typeof l.getWeekInfo === 'function' ? l.getWeekInfo() : l.weekInfo;
    if (wi && wi.firstDay >= 1 && wi.firstDay <= 7) return wi.firstDay;
  } catch(e){}
  return 1;
}
function calendarHtml(items){
  const [y, m] = viewMonth.split('-').map(Number);
  const first = new Date(y, m-1, 1);
  const ws = weekStart();
  const offset = (first.getDay() - (ws % 7) + 7) % 7;
  const dim = daysInMonth(viewMonth);
  const spent = {}, inc = {};
  for (const x of items){
    if (outOf(x)) spent[x.date] = (spent[x.date] || 0) + outOf(x);
    if (x.type === 'income' && !x.adj) inc[x.date] = (inc[x.date] || 0) + x.amount;
  }
  const max = Math.max(0, ...Object.values(spent));
  let head = '';
  for (let i = 0; i < 7; i++) head += '<span>' + esc(new Date(2024, 0, ws + i).toLocaleDateString(loc(), {weekday:'narrow'})) + '</span>';
  let cells = '';
  for (let i = 0; i < offset; i++) cells += '<span class="cal-pad"></span>';
  const today = todayISO();
  for (let d = 1; d <= dim; d++){
    const date = viewMonth + '-' + pad(d);
    const s = spent[date] || 0;
    const lv = !s || !max ? 0 : s / max > 0.66 ? 3 : s / max > 0.33 ? 2 : 1;
    const label = dayLabel(date) + (s ? ', ' + t('spent') + ' ' + fmt(s) : '') + (inc[date] ? ', ' + t('income') + ' ' + fmt(inc[date]) : '');
    cells += '<button class="cal-day l' + lv + (date === today ? ' today' : '') + '" data-day="' + date + '" aria-pressed="' + (date === selDay) + '" aria-label="' + esc(label) + '">' +
      '<span>' + d + '</span>' + (s ? '<small>' + esc(fmtTiny(s)) + '</small>' : '') + (inc[date] ? '<i class="dot"></i>' : '') + '</button>';
  }
  return '<div class="cal"><div class="cal-head">' + head + '</div><div class="cal-grid">' + cells + '</div></div>';
}

function goalSubText(g){
  const saved = goalSaved(g);
  if (saved >= g.target) return t('goal_reached');
  if (!g.deadline) return t('no_deadline');
  const daysLeft = daysBetween(todayISO(), g.deadline);
  if (daysLeft < 0) return t('deadline_passed');
  const months = Math.max(1, Math.ceil(daysLeft / 30.44));
  return t('per_month_needed', {a:fmt((g.target - saved) / months), d:dateLabel(g.deadline)});
}

function renderInsights(){
  renderBalanceChart();
  const cm = currentMonth();
  const list = monthTx(viewMonth);
  const exps = list.filter(x => x.type === 'expense' && !x.adj);
  const {inc, exp} = totals(list);
  const byCat = new Map();
  const addCat = (c, a) => { const g = byCat.get(c.id) || {cat:c, total:0}; g.total += a; byCat.set(c.id, g); };
  for (const x of exps) addCat(catOf(x), x.amount);
  for (const x of list) if (x.fee) addCat(catById('expense', 'fees'), x.fee);
  const segs = Array.from(byCat.values()).sort((a,b) => b.total - a.total);
  if (!segs.length){
    $('#donutWrap').innerHTML = emptyState(t('no_spending_month', {m:monthLabel(viewMonth)}), false);
  } else {
    let off = 0;
    const circles = segs.map(s => {
      const pct = s.total / exp * 100;
      const gap = segs.length > 1 ? Math.min(0.8, pct/3) : 0;
      const len = Math.max(pct - gap, 0.01);
      const html = '<circle cx="60" cy="60" r="46" pathLength="100" stroke="' + s.cat.c + '" stroke-dasharray="' + len.toFixed(3) + ' ' + (100 - len).toFixed(3) + '" stroke-dashoffset="' + (-off).toFixed(3) + '"/>';
      off += pct;
      return html;
    }).join('');
    const legend = segs.map(s => {
      const pct = s.total / exp * 100;
      return '<div class="leg"><span class="leg-e" aria-hidden="true">' + s.cat.e + '</span><span class="leg-name">' + esc(catName(s.cat)) + '</span>' +
        '<span class="leg-amt">' + esc(fmt(s.total)) + '<span class="leg-pct">' + Math.round(pct) + '%</span></span>' +
        '<span class="leg-bar"><i style="width:' + pct.toFixed(1) + '%;background:' + s.cat.c + '"></i></span></div>';
    }).join('');
    $('#donutWrap').innerHTML =
      '<div class="donut-box"><svg class="donut" viewBox="0 0 120 120" role="img" aria-label="' + esc(t('where_went')) + '"><circle class="donut-track" cx="60" cy="60" r="46"/><g transform="rotate(-90 60 60)" fill="none" stroke-width="16">' + circles + '</g></svg>' +
      '<div class="donut-center"><strong>' + esc(fmtShort(exp)) + '</strong><span>' + esc(t('spent_lower')) + '</span></div></div>' +
      '<div class="legend">' + legend + '</div>';
  }
  const status = viewMonth === cm ? 'current' : (viewMonth < cm ? 'past' : 'future');
  const daysCounted = status === 'current' ? new Date().getDate() : (status === 'past' ? daysInMonth(viewMonth) : 0);
  const avg = daysCounted ? exp / daysCounted : null;
  const kept = inc > 0 ? Math.round((inc - exp) / inc * 100) : null;
  const biggest = exps.slice().sort((a,b) => b.amount - a.amount)[0];
  const top = segs[0];
  const fact = (label, value, sub) => '<div class="fact"><span>' + esc(label) + '</span><strong>' + esc(value) + '</strong><small>' + esc(sub) + '</small></div>';
  $('#facts').innerHTML =
    fact(t('daily_avg'), avg != null && exp ? fmt(avg) : '—', t('per_day')) +
    fact(t('kept'), kept != null ? kept + '%' : '—', inc > 0 ? fmt(inc - exp, true) : t('no_income')) +
    fact(t('top_cat'), top ? top.cat.e + ' ' + catName(top.cat) : '—', top ? fmt(top.total) : t('no_spending')) +
    fact(t('largest'), biggest ? fmt(biggest.amount) : '—', biggest ? (biggest.desc || catName(catOf(biggest))) : t('no_spending'));

  const months = [];
  for (let i = 5; i >= 0; i--) months.push(shiftMonth(viewMonth, -i));
  const data = months.map(m => Object.assign({m}, totals(monthTx(m))));
  const max = Math.max(1, ...data.map(d => Math.max(d.inc, d.exp)));
  const cols = data.map(d => {
    const label = t('bars_label', {m:monthLabel(d.m), i:fmt(d.inc), s:fmt(d.exp)});
    return '<button class="bar-col' + (d.m === viewMonth ? ' cur' : '') + '" data-month="' + d.m + '" aria-label="' + esc(label) + '">' +
      '<span class="bar-pair"><span class="b in" style="height:' + (d.inc/max*100).toFixed(1) + '%"></span><span class="b out" style="height:' + (d.exp/max*100).toFixed(1) + '%"></span></span>' +
      '<span class="bar-lbl">' + esc(monthLabel(d.m, {month:'short'})) + '</span></button>';
  }).join('');
  $('#trend').innerHTML = '<div class="bars">' + cols + '</div>' +
    '<div class="bar-legend"><span><i style="background:var(--success)"></i>' + esc(t('income')) + '</span><span><i style="background:var(--primary)"></i>' + esc(t('spent')) + '</span></div>';
}

let toastTimer;

  const el = $('#toast'), b = $('#toastAct');

    b.hidden = false; b.textContent = actLabel;
    b.onclick = () => { b.onclick = null; act(); el.classList.remove('show'); };

function saveTx(){
  const err = $('#txErr');
  const amt = parseAmount($('#txAmount').value);
  const date = $('#txDate').value;
  if (!(amt > 0)){ err.textContent = t('err_amount'); $('#txAmount').focus(); return; }
  if (amt > 1e12){ err.textContent = t('err_large'); return; }
  if (!isISO(date)){ err.textContent = t('err_date'); return; }
  const feeRaw = $('#txFee').value.trim();
  const fee = feeRaw === '' ? 0 : parseAmount(feeRaw);
  if (!isFinite(fee) || fee < 0 || fee > 1e12){ err.textContent = t('err_fee'); $('#txFee').focus(); return; }
  const isT = txS.type === 'transfer';

function rateNum(v){ try { return new Intl.NumberFormat(loc(), {maximumSignificantDigits:6}).format(v); } catch(e){ return String(v); } }
const RATE_TTL = 12 * 3600 * 1000;
let rateBusy = false;
function rateFresh(){
  const s2 = db.settings.second;
  return !!(s2 && s2.rate > 0 && s2.base === db.settings.currency && s2.updated && Date.now() - s2.updated < RATE_TTL);
}
async function refreshRate(force){
  const s2 = db.settings.second;
  if (!s2 || !s2.auto || rateBusy) return false;
  if (!force && rateFresh()) return false;
  if (typeof navigator !== 'undefined' && navigator.onLine === false) return false;
  const base = db.settings.currency, target = s2.cur;
  if (base === target) return false;
  rateBusy = true;
  let ctrl = null, to = null;
  try {
    if (typeof AbortController !== 'undefined'){ ctrl = new AbortController(); to = setTimeout(() => ctrl.abort(), 8000); }
    const r = await fetch('https://open.er-api.com/v6/latest/' + encodeURIComponent(base), {cache:'no-store', signal: ctrl ? ctrl.signal : undefined});
    if (!r.ok) throw new Error('http');
    const j = await r.json();
    const v = j && j.result === 'success' && j.rates ? Number(j.rates[target]) : NaN;
    if (!(v > 0) || !isFinite(v)) throw new Error('rate');
    const cur = db.settings.second;
    if (!cur || cur !== s2 || cur.cur !== target || db.settings.currency !== base || !cur.auto) return false;
    cur.rate = v; cur.base = base; cur.updated = Date.now();
    save(); render();
    return true;
  } catch(e){ return false; }
  finally { if (to) clearTimeout(to); rateBusy = false; }
}

/* ================= Balance chart ================= */
let balRange = '3M', balWallet = 'all', chartState = null;
function txDelta(x, w){
  const fee = x.fee || 0;
  if (w === 'all'){
    if (x.type === 'income') return x.amount - fee;
    if (x.type === 'expense') return -x.amount - fee;
    return -fee;
  }
  let d = 0;
  if (x.wallet === w){ d += x.type === 'income' ? x.amount : -x.amount; d -= fee; }
  if (x.type === 'transfer' && x.toWallet === w) d += x.amount;
  return d;
}
function balanceSeries(w, range){
  const end = todayISO();
  let start;
  if (range === 'ALL'){
    start = end;
    for (const x of db.tx) if (x.date < start) start = x.date;
    if (daysBetween(start, end) < 7) start = addDays(end, -6);
  } else {
    start = addDays(end, -({'1M':30, '3M':91, '6M':182, '1Y':365}[range] || 91) + 1);
  }
  let base = w === 'all' ? db.wallets.reduce((a,x) => a + (x.opening || 0), 0) : ((walletById(w) || {}).opening || 0);
  const byDay = {};
  for (const x of db.tx){
    if (x.date > end) continue;
    const d = txDelta(x, w);
    if (!d) continue;
    if (x.date < start) base += d;
    else byDay[x.date] = (byDay[x.date] || 0) + d;
  }
  const pts = [];
  let v = base, d = start, guard = 0;
  while (d <= end && guard++ < 4000){ v += byDay[d] || 0; pts.push({d, v:round2(v)}); d = addDays(d, 1); }
  if (pts.length > 240){
    const step = Math.ceil(pts.length / 240);
    const s2 = pts.filter((p, i) => i % step === 0);
    if (s2[s2.length-1] !== pts[pts.length-1]) s2.push(pts[pts.length-1]);
    return s2;
  }
  return pts;
}

  if (balWallet !== 'all' && !walletById(balWallet)) balWallet = 'all';
  sel.value = balWallet;

  const box = $('#balChart');
  if (!db.tx.length){ box.innerHTML = emptyState(t('no_history'), false); chartState = null; return; }
  const pts = balanceSeries(balWallet, balRange);
  const vals = pts.map(p => p.v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi === lo){ hi += Math.max(1, Math.abs(hi) * 0.1); lo -= Math.max(1, Math.abs(lo) * 0.1); }
  const pad = (hi - lo) * 0.08; hi += pad; lo -= pad;
  const W = 340, H = 150, T = 8, B = 142;
  const X = i => pts.length > 1 ? i / (pts.length - 1) * W : W / 2;
  const Y = v => T + (hi - v) / (hi - lo) * (B - T);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ');
  const area = line + ' L' + X(pts.length - 1).toFixed(1) + ' ' + B + ' L0 ' + B + ' Z';
  const zeroY = lo < 0 && hi > 0 ? Y(0) : null;
  const negFill = lo < 0 ? '<clipPath id="belowZero"><rect x="0" y="' + (zeroY != null ? zeroY : T).toFixed(1) + '" width="' + W + '" height="' + H + '"/></clipPath>' +
    '<path d="' + line + ' L' + W + ' ' + (zeroY != null ? zeroY : T).toFixed(1) + ' L0 ' + (zeroY != null ? zeroY : T).toFixed(1) + ' Z" fill="var(--danger)" opacity=".18" clip-path="url(#belowZero)"/>' : '';
  const grid = [0.25, 0.5, 0.75].map(f => '<line class="chart-grid" x1="0" x2="' + W + '" y1="' + (T + f * (B - T)).toFixed(1) + '" y2="' + (T + f * (B - T)).toFixed(1) + '"/>').join('');
  const first = pts[0].v, last = pts[pts.length-1].v, change = last - first;
  const mid = pts[Math.floor((pts.length - 1) / 2)].d;
  box.innerHTML =
    '<div class="sumrow" style="margin:6px 2px 0"><span>' + esc(t('now_bal', {a:''})) + '<b class="' + (last < 0 ? 'neg' : '') + '">' + esc(fmt(last)) + '</b></span>' +
    '<span>' + esc(t('change_period', {a:''})) + '<b class="' + (change < 0 ? 'neg' : 'pos') + '">' + esc(fmt(change, true)) + '</b></span></div>' +
    '<div class="chart-wrap" id="chartWrap"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(t('balance_over_time')) + '">' +
    '<defs><linearGradient id="balg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--primary);stop-opacity:.28"/><stop offset="1" style="stop-color:var(--primary);stop-opacity:0"/></linearGradient></defs>' +
    grid + '<path d="' + area + '" fill="url(#balg)"/>' + negFill +
    (zeroY != null ? '<line class="chart-zero" x1="0" x2="' + W + '" y1="' + zeroY.toFixed(1) + '" y2="' + zeroY.toFixed(1) + '"/>' : '') +
    '<path class="chart-line" d="' + line + '"' + (last < 0 ? ' style="stroke:var(--danger)"' : '') + '/>' +
    '<line class="chart-guide" id="chGuide" x1="0" x2="0" y1="' + T + '" y2="' + B + '" style="display:none"/><circle class="chart-dot" id="chDot" r="4.5" cx="' + X(pts.length-1).toFixed(1) + '" cy="' + Y(last).toFixed(1) + '"/>' +
    '</svg><div class="chart-tip" id="chTip" hidden></div></div>' +
    '<div class="chart-x"><span>' + esc(dateLabel(pts[0].d)) + '</span><span>' + esc(dateLabel(mid)) + '</span><span>' + esc(dateLabel(pts[pts.length-1].d)) + '</span></div>';
  chartState = {pts, X, Y, W};
}
function chartPoint(clientX){
  if (!chartState) return;
  const wrap = $('#chartWrap'); if (!wrap) return;
  const r = wrap.getBoundingClientRect();
  const f = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
  const n = chartState.pts.length;
  const i = Math.round(f * (n - 1));
  const p = chartState.pts[i];
  const x = chartState.X(i), y = chartState.Y(p.v);
  const g = $('#chGuide'), dot = $('#chDot'), tip = $('#chTip');
